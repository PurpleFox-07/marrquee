# Marrquee - paste this whole file into your NAS's Docker app.
#
# On the Ugreen NAS: open the Docker app, choose Project, then Create, and
# paste this in. Nothing here needs changing except the port (only if
# something else on your NAS is already using 7788) and the optional
# MARRQUEE_RESET_LOGIN line further down (only if you forget your apps'
# password - see the README's "Forgot your apps' password?" section).
services:
  marrquee:
    image: ghcr.io/purplefox-07/marrquee:latest
    container_name: marrquee
    restart: unless-stopped
    ports:
      # If something already uses 7788, change only the first number - the
      # second number is the port Marrquee listens on inside its own
      # container, and must stay 7788.
      - "7788:7788"
    volumes:
      # Lets Marrquee see whether Docker is running, and lets it start the
      # apps you choose - through the compose file it writes for you -
      # once you deploy.
      - /var/run/docker.sock:/var/run/docker.sock
      # Where Marrquee keeps the choices you make and the settings it
      # generates - a "config" folder that sits right next to this project
      # in your NAS's Files app. This survives restarts and reinstalls.
      - ./config:/config
      # On Ugreen and Synology-style NAS boxes, every shared folder lives
      # under /volume1 - if a second drive pool shows up as /volume2 on
      # yours, add a second line here: "/volume2:/host/volume2". Marrquee
      # can only see and build inside what is mounted here, and only ever
      # writes inside the one folder you type. (The NAS's Docker app no
      # longer accepts mounting the whole NAS as one line, so this is
      # mounted folder by folder instead.)
      - /volume1:/host/volume1
    environment:
      # Forgot the login for your apps? Type any word between the quotes
      # (for example MARRQUEE_RESET_LOGIN: "reset"), choose Redeploy, then
      # choose a new login on your Hub. Once you're signed in with it,
      # empty the quotes again and choose Redeploy once more.
      MARRQUEE_RESET_LOGIN: ""
