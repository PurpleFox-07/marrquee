name: CI

# Quoted so PyYAML (used by tests/test_workflow.py) reads this key back as
# the string "on" rather than the boolean True, which is how YAML 1.1
# parses a bare `on:` key.
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run the test suite
        run: uv run pytest

  image:
    name: Build, smoke test and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Registers QEMU binfmt handlers so the runner's amd64 kernel can
      # execute an arm64 image - this is what proves "works on ARM" without
      # the owner's NAS ever being involved.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A multi-platform build cannot be `--load`ed into the local Docker
      # daemon, so each architecture is built single-platform and loaded on
      # its own for the smoke test below. The multi-arch build that actually
      # gets pushed happens once, later, after both smokes pass.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marrquee:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner's own /var/run/docker.sock is a real Linux daemon socket
      # (not the VM shim a Mac's Docker Desktop presents), so this is a
      # stronger check than the dev machine could ever give.
      - name: Start the amd64 image against the runner's real Docker socket
        run: |
          docker run -d --name marrquee-smoke-amd64 \
            -p 7788:7788 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            marrquee:smoke-amd64

      - name: Wait for the amd64 image to answer /healthz
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 30s on amd64"
          docker logs marrquee-smoke-amd64
          exit 1

      - name: Assert the amd64 image is talking to the runner's real Docker daemon
        run: curl -fsS http://127.0.0.1:7788/diagnostics | grep -q "Talking to Docker"

      - name: Stop the amd64 smoke container
        if: always()
        run: docker rm -f marrquee-smoke-amd64

      # This is the answer to the one question reading the code can't settle:
      # does the pinned docker-compose binary bring services up with no
      # `docker` CLI in the image? A separate, ephemeral container proves it
      # against the runner's real socket, independent of the alive-page smoke
      # above.
      - name: Prove the pinned compose binary runs without a docker CLI
        run: docker run --rm --entrypoint /usr/local/bin/docker-compose marrquee:smoke-amd64 version

      - name: Write a throwaway compose file for the compose-binary smoke
        run: |
          cat > compose-smoke.yaml <<'EOF'
          services:
            smoke:
              image: alpine:3.20
              container_name: marrquee-compose-smoke
              command: ["sleep", "300"]
          EOF

      - name: Bring the throwaway service up through the image's compose binary
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/compose-smoke.yaml:/tmp/compose-smoke.yaml:ro" \
            --entrypoint /usr/local/bin/docker-compose \
            marrquee:smoke-amd64 \
            -p compose-smoke -f /tmp/compose-smoke.yaml up -d

      - name: Assert the compose-binary smoke's service is running
        run: |
          docker ps --filter "name=marrquee-compose-smoke" --format '{{.Names}}' \
            | grep -q marrquee-compose-smoke

      - name: Remove the compose-binary smoke's throwaway container
        if: always()
        run: docker rm -f marrquee-compose-smoke || true

      - name: Build the arm64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: marrquee:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only /healthz is asserted here - it needs no Docker socket, and the
      # only thing this step is proving is "does this binary start on ARM".
      - name: Start the arm64 image under QEMU emulation
        run: |
          docker run -d --name marrquee-smoke-arm64 \
            --platform linux/arm64 \
            -p 7788:7788 \
            marrquee:smoke-arm64

      - name: Wait for the arm64 image to answer /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 60s on arm64"
          docker logs marrquee-smoke-arm64
          exit 1

      - name: Stop the arm64 smoke container
        if: always()
        run: docker rm -f marrquee-smoke-arm64

      # Everything from here on only runs for a real push (never for a pull
      # request, which cannot use `packages: write`), and only after both
      # smokes above have passed - a half-tested image never reaches :latest.
      - name: Prepare image metadata for the published tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Written out literally, never derived from the repository's own
          # name - that carries its real mixed case (PurpleFox-07/marrquee),
          # and GHCR rejects uppercase image paths.
          images: ghcr.io/purplefox-07/marrquee
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Written out on purpose: this label is what makes the published
          # package's page on GitHub link back to the project page. The action
          # would also derive it on its own, but a stated value can be read
          # here and is pinned by a test.
          labels: |
            org.opencontainers.image.source=https://github.com/PurpleFox-07/marrquee

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published tag lists both platforms
        if: github.event_name == 'push'
        run: |
          output=$(docker buildx imagetools inspect ghcr.io/purplefox-07/marrquee:latest)
          echo "$output"
          echo "$output" | grep -q "linux/amd64"
          echo "$output" | grep -q "linux/arm64"

  # This is the acceptance vehicle for every "unverifiable by reading"
  # condition the deploy engine carries: real Docker, real arr images, a
  # real deploy driven the exact way the owner's own first NAS commands
  # will drive it. It pulls three external images and can go red for
  # reasons that have nothing to do with this repository's own code (a
  # registry hiccup, a slow image pull) - so, deliberately, it `needs: test`
  # alone and is never in `image`'s `needs:`, and `image` is never in this
  # job's `needs:` either. A red run here is loud (this job still fails, and
  # the whole workflow shows red) but it never holds back `:latest`.
  stack-smoke:
    name: Real-Docker stack smoke (two arr apps, then add one from the Hub)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image for the stack smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marrquee:stack-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh, empty folder on the runner's own disk - never inside the
      # repository checkout - so a fresh-start refusal can never fire here.
      - name: Create a fresh storage root under the runner's temp directory
        run: mkdir -p "$RUNNER_TEMP/marrquee-smoke/media"

      # Started the same way `compose.install.yaml` starts it, but mirroring
      # its partial-mount shape rather than a whole-drive one: the socket,
      # the port, and the runner's own temp root mounted at `/host` plus
      # that same path. That's the exact "host path X lands at /host/X"
      # mapping the NAS now uses, so this proves it against a mount that
      # only covers part of the host, not `/:/host`, while still reaching
      # the storage root created just above.
      - name: Start the built image the way the install file does
        run: |
          docker run -d --name marrquee-stack-smoke \
            -p 7788:7788 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/host${RUNNER_TEMP}" \
            marrquee:stack-smoke

      - name: Wait for Marrquee to answer /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 60s"
          docker logs marrquee-stack-smoke
          exit 1

      # A throwaway login, generated fresh for this one run and masked
      # immediately - it's the same username and password every app in this
      # job will end up asking for, so it has to reach the install body,
      # but it must never land in the job log.
      - name: Generate a throwaway login for this run
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "MARRQUEE_CI_PASSWORD=$pw" >> "$GITHUB_ENV"

      # The API only ever sees a HOST path - Marrquee translates it to
      # `<host_mount>/<that path>` internally, and the generated compose
      # file carries this exact host path back out again. Radarr is
      # deliberately left out of this first install - this job's whole
      # point is proving it arrives later, through the Hub's own add
      # endpoint, onto a stack that is already running.
      - name: Install two apps against the runner's own temp folder
        run: |
          curl -fsS -X POST http://127.0.0.1:7788/api/install \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"${RUNNER_TEMP}/marrquee-smoke/media\",\"app_ids\":[\"prowlarr\",\"sonarr\"],\"login\":{\"username\":\"marrquee-ci\",\"password\":\"${MARRQUEE_CI_PASSWORD}\"}}"

      - name: Start the deploy
        run: curl -fsS -X POST http://127.0.0.1:7788/api/deploy

      # Generous on purpose: this is the first time all three images are
      # ever pulled, on a shared runner with no cache for them.
      #
      # On failure, the snapshot's own `code` and `headline` land straight
      # in a `::error::` annotation - GitHub's public annotations API is
      # readable without a login, unlike the job log itself, and both
      # fields are already plain-language and secret-free by the API's own
      # contract (see routes/api.py - only /api/deploy/diagnostics ever
      # carries technical detail).
      - name: Poll GET /api/deploy until it reaches finale (8+ minute budget)
        run: |
          for _ in $(seq 1 260); do
            body=$(curl -fsS http://127.0.0.1:7788/api/deploy)
            phase=$(echo "$body" | jq -r '.phase')
            echo "deploy phase: $phase"
            if [ "$phase" = "finale" ]; then
              exit 0
            fi
            if [ "$phase" = "error" ]; then
              code=$(echo "$body" | jq -r '.failure.code // "unknown"')
              headline=$(echo "$body" | jq -r '.headline // "the deploy reported an error"')
              MESSAGE="the deploy reached error (${code}): ${headline}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the deploy never reached finale in time"
          exit 1

      # A real daemon is the only way to prove `compose up -d --no-recreate
      # <service>` leaves an already-running container's identity alone.
      # Recorded now, before Radarr ever exists, so the add can be judged
      # against a real baseline instead of an assumption.
      - name: Record Prowlarr and Sonarr's container id and start time before the add
        run: |
          prowlarr_before=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' prowlarr)
          sonarr_before=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' sonarr)
          echo "prowlarr before: $prowlarr_before"
          echo "sonarr before: $sonarr_before"
          echo "PROWLARR_BEFORE=$prowlarr_before" >> "$GITHUB_ENV"
          echo "SONARR_BEFORE=$sonarr_before" >> "$GITHUB_ENV"

      # Adds one app to an already-running stack through the Hub's own
      # endpoint, never a second full deploy.
      - name: Add Radarr to the running stack through the Hub's install endpoint
        run: |
          response=$(curl -s -w '\n%{http_code}' -X POST \
            http://127.0.0.1:7788/api/hub/apps/radarr/install \
            -H "Content-Type: application/json" \
            -d '{"answers":{}}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "hub install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/radarr/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

      - name: Poll GET /api/hub/status until Radarr finishes adding (5 minute budget)
        run: |
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            radarr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "radarr")')
            state=$(echo "$radarr" | jq -r '.state')
            add_state=$(echo "$radarr" | jq -r '.add_state')
            busy=$(echo "$status" | jq -r '.busy')
            line=$(echo "$radarr" | jq -r '.line')
            echo "radarr state: $state / add_state: $add_state / busy: $busy"
            if [ "$add_state" = "error" ]; then
              MESSAGE="adding Radarr failed: ${line}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            if [ "$state" = "up" ] && [ "$add_state" = "null" ] && [ "$busy" = "false" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Radarr never finished adding to the running stack within 5 minutes"
          exit 1

      # The recreate check itself: adding Radarr must never recreate a
      # container that was already running.
      - name: Assert Prowlarr and Sonarr were not recreated by adding Radarr
        run: |
          prowlarr_after=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' prowlarr)
          sonarr_after=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' sonarr)
          echo "prowlarr after: $prowlarr_after"
          echo "sonarr after: $sonarr_after"
          if [ "$prowlarr_after" != "$PROWLARR_BEFORE" ] || [ "$sonarr_after" != "$SONARR_BEFORE" ]; then
            echo "::error::Prowlarr or Sonarr was recreated by adding Radarr"
            exit 1
          fi

      - name: Assert all three containers are running
        run: |
          for name in prowlarr sonarr radarr; do
            docker ps --filter "name=^${name}$" --format '{{.Names}}' | grep -qx "$name"
          done

      # This is the regression this whole job exists to catch: every app
      # container, and Marrquee's own, must share the `marrquee` network -
      # not just have a network of that name sitting unused alongside them.
      - name: Assert the marrquee network lists all three apps and Marrquee itself
        run: |
          members=$(docker network inspect marrquee --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "marrquee network members: $members"
          for name in prowlarr sonarr radarr marrquee-stack-smoke; do
            echo "$members" | grep -qw "$name"
          done

      # write_compose chowns this file to the drive's own owner (not root)
      # specifically so it can be read - by the owner on their NAS, and by
      # this very step here. Asserted on its own, before the step that reads
      # it, so a regression here is named instead of surfacing as a
      # mysterious 401 two steps later.
      - name: Assert the compose file is readable by the current user
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          if [ ! -r "$compose_file" ]; then
            echo "::error::$compose_file is not readable by $(whoami) - write_compose's chown regressed"
            ls -l "$compose_file" || true
            exit 1
          fi

      # The API never exposes an app's key - it is read here straight off
      # the generated compose file on the runner's own disk, the same file
      # the owner is told to open and read in the README. Never echoed.
      - name: Assert each app answers system/status with the key from its own compose file
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ]; then
            echo "::error::could not read Prowlarr's API key out of the compose file"
            exit 1
          fi
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi
          if [ -z "$radarr_key" ]; then
            echo "::error::could not read Radarr's API key out of the compose file"
            exit 1
          fi
          curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/system/status
          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/system/status
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/system/status

      - name: Assert the expected folders exist inside the chosen root
        run: |
          root="$RUNNER_TEMP/marrquee-smoke/media"
          test -d "$root/data/torrents/tv"
          test -d "$root/data/torrents/movies"
          test -d "$root/data/media/tv"
          test -d "$root/data/media/movies"
          test -f "$root/marrquee/compose.yaml"
          test -f "$root/marrquee/marrquee-root.json"

      # This is the proof the whole story exists for: adding an application
      # in Prowlarr is a live, two-directional connection test (both
      # containers really do have to see each other, or Prowlarr refuses to
      # save it) - so a passing assertion here means the apps are genuinely
      # wired together, not just that a setting was written somewhere.
      - name: Assert Prowlarr, Sonarr and Radarr are wired together
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ] || [ -z "$sonarr_key" ] || [ -z "$radarr_key" ]; then
            echo "::error::could not read every app's API key out of the compose file"
            exit 1
          fi

          applications=$(curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/applications)
          echo "$applications" | jq -e 'length == 2' > /dev/null
          echo "$applications" | jq -e '[.[].implementation] | sort == ["Radarr", "Sonarr"]' > /dev/null
          echo "$applications" | jq -e '[.[].syncLevel] | all(. == "fullSync")' > /dev/null

          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/rootfolder \
            | jq -e '[.[].path] | any(endswith("/data/media/tv"))' > /dev/null
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/rootfolder \
            | jq -e '[.[].path] | any(endswith("/data/media/movies"))' > /dev/null

          curl -fsS http://127.0.0.1:7788/api/deploy \
            | jq -e '[.wiring[].state] | length > 0 and all(. == "done")' > /dev/null

      # The one proof reading the arr apps' source can't settle: does the
      # real `:latest` image actually accept a login through `config/host`,
      # and does its own `/login` page actually enforce it - the right
      # password gets in, a wrong one is refused. Never echoes the password;
      # it only ever appears inside a `--data-urlencode` argument.
      - name: Assert every app asks for the one login
        run: |
          set -euo pipefail
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ] || [ -z "$sonarr_key" ] || [ -z "$radarr_key" ]; then
            echo "::error::could not read every app's API key out of the compose file"
            exit 1
          fi

          assert_app_asks_for_the_login() {
            app_name="$1"
            port="$2"
            api_version="$3"
            api_key="$4"

            host_config=$(curl -fsS -H "X-Api-Key: ${api_key}" "http://127.0.0.1:${port}/api/${api_version}/config/host")
            if ! echo "$host_config" \
              | jq -e '.authenticationMethod=="forms" and .authenticationRequired=="enabled" and .username=="marrquee-ci"' \
              > /dev/null
            then
              echo "::error::${app_name} did not take the one login"
              exit 1
            fi

            good_redirect=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST \
              --data-urlencode "username=marrquee-ci" \
              --data-urlencode "password=${MARRQUEE_CI_PASSWORD}" \
              "http://127.0.0.1:${port}/login?returnUrl=%2F")
            if echo "$good_redirect" | grep -q "loginFailed=true"; then
              echo "::error::${app_name} did not take the one login"
              exit 1
            fi

            bad_redirect=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST \
              --data-urlencode "username=marrquee-ci" \
              --data-urlencode "password=definitely-the-wrong-password" \
              "http://127.0.0.1:${port}/login?returnUrl=%2F")
            if ! echo "$bad_redirect" | grep -q "loginFailed=true"; then
              echo "::error::${app_name} did not take the one login"
              exit 1
            fi
          }

          assert_app_asks_for_the_login "Prowlarr" 9696 v1 "$prowlarr_key"
          assert_app_asks_for_the_login "Sonarr" 8989 v3 "$sonarr_key"
          assert_app_asks_for_the_login "Radarr" 7878 v3 "$radarr_key"

      # The other proof reading source can't settle: an already-running
      # app's environment settings win over its own settings file until its
      # container is recreated. Sonarr is put back into the shape it would
      # already be running in on a real NAS before this login feature
      # existed - `External` / `DisabledForLocalAddresses` - by writing a
      # `sed`-adjusted copy of compose.yaml to a runner temp file (Marrquee's
      # own file is only ever read here, never written to) and bringing that
      # copy up directly through the runner's own compose. Choosing a login
      # from the Hub then has to recreate Sonarr alone to switch it back,
      # leaving Prowlarr and Radarr - whose running settings never diverged
      # from what is already on disk - untouched.
      - name: A Cycle-1 app switches over from the Hub
        run: |
          set -euo pipefail
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          cycle1_compose="$RUNNER_TEMP/cycle1-compose.yaml"
          sed \
            -e 's/SONARR__AUTH__METHOD: "Forms"/SONARR__AUTH__METHOD: "External"/' \
            -e 's/SONARR__AUTH__REQUIRED: "Enabled"/SONARR__AUTH__REQUIRED: "DisabledForLocalAddresses"/' \
            "$compose_file" > "$cycle1_compose"

          sonarr_id_pre_switch=$(docker inspect -f '{{.Id}}' sonarr)
          docker compose -p marrquee-apps -f "$cycle1_compose" up -d sonarr

          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi

          # A freshly recreated container can take 10-30s to answer its own
          # API - far longer than the login applier's own retry budget - so
          # phase 1 of the login run below must never race it. Bounded to 3
          # minutes at a 2s cadence.
          sonarr_ready=false
          for _ in $(seq 1 90); do
            if curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/system/status > /dev/null 2>&1; then
              sonarr_ready=true
              break
            fi
            sleep 2
          done
          if [ "$sonarr_ready" != "true" ]; then
            echo "::error::Sonarr never came back after the Cycle-1 recreate"
            exit 1
          fi

          prowlarr_before=$(docker inspect -f '{{.Id}}' prowlarr)
          sonarr_before=$(docker inspect -f '{{.Id}}' sonarr)
          radarr_before=$(docker inspect -f '{{.Id}}' radarr)
          if [ "$sonarr_before" = "$sonarr_id_pre_switch" ]; then
            echo "::error::Sonarr was not recreated by the Cycle-1 switch-over - the runner's compose saw no config change"
            exit 1
          fi

          docker exec marrquee-stack-smoke rm -f /config/login.json

          banner=$(curl -fsS http://127.0.0.1:7788/api/hub/status | jq -r '.login_banner')
          if [ "$banner" != "choose" ]; then
            echo "::error::expected login_banner=choose after deleting login.json, got ${banner}"
            exit 1
          fi

          # No Origin, no Sec-Fetch-Site - curl sends neither, so this
          # reaches the route the same way a same-origin browser post would.
          curl -fsS -o /dev/null -X POST http://127.0.0.1:7788/hub/login \
            --data-urlencode "username=marrquee-ci" \
            --data-urlencode "password=${MARRQUEE_CI_PASSWORD}" \
            --data-urlencode "password_again=${MARRQUEE_CI_PASSWORD}"

          # 5 minute budget at a 2s cadence - generous because this is the
          # first time the login run has ever recreated a real container.
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            busy=$(echo "$status" | jq -r '.busy')
            banner=$(echo "$status" | jq -r '.login_banner')
            echo "login run: busy=$busy login_banner=$banner"
            if [ "$banner" = "pending" ]; then
              echo "::error::the login run left an app pending (login_banner=pending)"
              exit 1
            fi
            if [ "$busy" = "false" ] && [ "$banner" = "none" ]; then
              break
            fi
            sleep 2
          done
          status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
          busy=$(echo "$status" | jq -r '.busy')
          banner=$(echo "$status" | jq -r '.login_banner')
          if [ "$busy" != "false" ] || [ "$banner" != "none" ]; then
            echo "::error::the login run never finished within 5 minutes (busy=${busy} login_banner=${banner})"
            exit 1
          fi

          prowlarr_after=$(docker inspect -f '{{.Id}}' prowlarr)
          sonarr_after=$(docker inspect -f '{{.Id}}' sonarr)
          radarr_after=$(docker inspect -f '{{.Id}}' radarr)
          if [ "$prowlarr_after" != "$prowlarr_before" ]; then
            echo "::error::Choosing the login recreated Prowlarr"
            exit 1
          fi
          if [ "$radarr_after" != "$radarr_before" ]; then
            echo "::error::Choosing the login recreated Radarr"
            exit 1
          fi
          if [ "$sonarr_after" = "$sonarr_before" ]; then
            echo "::error::Sonarr's Cycle-1 container was never recreated by the login run"
            exit 1
          fi

          host_config=$(curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/config/host)
          if ! echo "$host_config" | jq -e '.authenticationMethod=="forms" and .authenticationRequired=="enabled"' > /dev/null; then
            echo "::error::Sonarr did not switch back to Forms after the login run"
            exit 1
          fi

      # "Twice is safe" only really means something proven against real
      # containers and a real Prowlarr database - re-running the whole
      # deploy must change nothing an owner could ever observe.
      - name: Deploy a second time to prove nothing changes
        run: curl -fsS -X POST http://127.0.0.1:7788/api/deploy

      - name: Poll GET /api/deploy until the second deploy reaches finale
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:7788/api/deploy)
            phase=$(echo "$body" | jq -r '.phase')
            echo "second deploy phase: $phase"
            if [ "$phase" = "finale" ]; then
              exit 0
            fi
            if [ "$phase" = "error" ]; then
              code=$(echo "$body" | jq -r '.failure.code // "unknown"')
              headline=$(echo "$body" | jq -r '.headline // "the deploy reported an error"')
              MESSAGE="the second deploy reached error (${code}): ${headline}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the second deploy never reached finale in time"
          exit 1

      - name: Assert the second deploy changed nothing observable
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')

          curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/applications \
            | jq -e 'length == 2' > /dev/null
          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/rootfolder \
            | jq -e 'length == 1' > /dev/null
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/rootfolder \
            | jq -e 'length == 1' > /dev/null
          curl -fsS http://127.0.0.1:7788/api/deploy \
            | jq -e '[.wiring[].state] | length > 0 and all(. == "done")' > /dev/null

      # The vehicle for the Pitch's one condition a Mac can't prove by
      # reading: on a real daemon, a running container's Docker-reported
      # state really does read as an Up poster with a working link. Run
      # last, after every earlier step that still needs Radarr running.
      - name: Assert the Hub shows every app Up and a link really opens
        run: |
          curl -fsS http://127.0.0.1:7788/ | grep -q 'data-hub'
          status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
          echo "$status" | jq -e '[.apps[].state] | length == 3 and all(. == "up")' > /dev/null

          sonarr_url=$(echo "$status" | jq -r '.apps[] | select(.app_id == "sonarr") | .url')
          if [ "$sonarr_url" != "http://127.0.0.1:8989/" ]; then
            echo "::error::Sonarr's poster url was '${sonarr_url}', expected http://127.0.0.1:8989/"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$sonarr_url")
          if [ "$code" = "000" ]; then
            echo "::error::Sonarr's poster link did not answer at all (curl returned 000)"
            exit 1
          fi

      # The other half of that same condition: a real `docker stop` really
      # does turn into an honest "Down - last seen just now" within the
      # Hub's own 15-second polling cadence, read here straight from the
      # live check both the page and this step share.
      - name: Stop Radarr and wait for the Hub to say Down
        run: |
          docker stop radarr
          for _ in $(seq 1 15); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            radarr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "radarr")')
            state=$(echo "$radarr" | jq -r '.state')
            line=$(echo "$radarr" | jq -r '.line')
            echo "radarr state: $state / line: $line"
            if [ "$state" = "down" ] && echo "$line" | grep -q "last seen"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Radarr never read Down with a last-seen line within 30 seconds of docker stop"
          exit 1

      # The one place technical detail is allowed to show up, and exactly
      # where a first-time developer needs it: a red run here is debuggable
      # from the workflow's own log, not just "it failed". The same text
      # also lands in a `::error::` annotation (truncated, and defensively
      # escaped - it is already redacted by `_redact_secrets`, but the
      # annotation itself must never be able to inject a further workflow
      # command), because the public annotations API is readable without a
      # login and the job log is not.
      - name: Dump diagnostics and Marrquee's own logs on failure
        if: failure()
        run: |
          echo "---- GET /api/deploy/diagnostics ----"
          diagnostics=$(curl -fsS http://127.0.0.1:7788/api/deploy/diagnostics || true)
          echo "$diagnostics"
          if [ -n "$diagnostics" ]; then
            DIAGNOSTICS="$diagnostics" \
              python3 -c "import os; text = os.environ['DIAGNOSTICS'][:1500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::Marrquee diagnostics (first 1500 chars): ' + text)"
          fi
          echo "---- docker logs marrquee-stack-smoke ----"
          docker logs marrquee-stack-smoke || true

      - name: Clean up every container, network and temp folder this job made
        if: always()
        run: |
          docker rm -f prowlarr sonarr radarr marrquee-stack-smoke 2>/dev/null || true
          docker network rm marrquee 2>/dev/null || true
          # Some of what's under here (a container's own /config contents)
          # can be created by the Docker daemon as root, which would block a
          # plain `rm -rf` run as the unprivileged runner user - GitHub-hosted
          # runners carry passwordless sudo for exactly this, and `|| true`
          # means a leftover temp folder never turns a green run red.
          sudo rm -rf "$RUNNER_TEMP/marrquee-smoke" || true
