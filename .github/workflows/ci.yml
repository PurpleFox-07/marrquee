name: CI

# Quoted so PyYAML (used by tests/test_workflow.py) reads this key back as
# the string "on" rather than the boolean True, which is how YAML 1.1
# parses a bare `on:` key.
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run the test suite
        run: uv run pytest

  image:
    name: Build, smoke test and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Registers QEMU binfmt handlers so the runner's amd64 kernel can
      # execute an arm64 image - this is what proves "works on ARM" without
      # the owner's NAS ever being involved.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A multi-platform build cannot be `--load`ed into the local Docker
      # daemon, so each architecture is built single-platform and loaded on
      # its own for the smoke test below. The multi-arch build that actually
      # gets pushed happens once, later, after both smokes pass.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marrquee:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner's own /var/run/docker.sock is a real Linux daemon socket
      # (not the VM shim a Mac's Docker Desktop presents), so this is a
      # stronger check than the dev machine could ever give.
      - name: Start the amd64 image against the runner's real Docker socket
        run: |
          docker run -d --name marrquee-smoke-amd64 \
            -p 7788:7788 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            marrquee:smoke-amd64

      - name: Wait for the amd64 image to answer /healthz
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 30s on amd64"
          docker logs marrquee-smoke-amd64
          exit 1

      - name: Assert the amd64 image is talking to the runner's real Docker daemon
        run: curl -fsS http://127.0.0.1:7788/diagnostics | grep -q "Talking to Docker"

      - name: Stop the amd64 smoke container
        if: always()
        run: docker rm -f marrquee-smoke-amd64

      # This is the answer to the one question reading the code can't settle:
      # does the pinned docker-compose binary bring services up with no
      # `docker` CLI in the image? A separate, ephemeral container proves it
      # against the runner's real socket, independent of the alive-page smoke
      # above.
      - name: Prove the pinned compose binary runs without a docker CLI
        run: docker run --rm --entrypoint /usr/local/bin/docker-compose marrquee:smoke-amd64 version

      - name: Write a throwaway compose file for the compose-binary smoke
        run: |
          cat > compose-smoke.yaml <<'EOF'
          services:
            smoke:
              image: alpine:3.20
              container_name: marrquee-compose-smoke
              command: ["sleep", "300"]
          EOF

      - name: Bring the throwaway service up through the image's compose binary
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/compose-smoke.yaml:/tmp/compose-smoke.yaml:ro" \
            --entrypoint /usr/local/bin/docker-compose \
            marrquee:smoke-amd64 \
            -p compose-smoke -f /tmp/compose-smoke.yaml up -d

      - name: Assert the compose-binary smoke's service is running
        run: |
          docker ps --filter "name=marrquee-compose-smoke" --format '{{.Names}}' \
            | grep -q marrquee-compose-smoke

      - name: Remove the compose-binary smoke's throwaway container
        if: always()
        run: docker rm -f marrquee-compose-smoke || true

      - name: Build the arm64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: marrquee:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only /healthz is asserted here - it needs no Docker socket, and the
      # only thing this step is proving is "does this binary start on ARM".
      - name: Start the arm64 image under QEMU emulation
        run: |
          docker run -d --name marrquee-smoke-arm64 \
            --platform linux/arm64 \
            -p 7788:7788 \
            marrquee:smoke-arm64

      - name: Wait for the arm64 image to answer /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 60s on arm64"
          docker logs marrquee-smoke-arm64
          exit 1

      - name: Stop the arm64 smoke container
        if: always()
        run: docker rm -f marrquee-smoke-arm64

      # Everything from here on only runs for a real push (never for a pull
      # request, which cannot use `packages: write`), and only after both
      # smokes above have passed - a half-tested image never reaches :latest.
      - name: Prepare image metadata for the published tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Written out literally, never derived from the repository's own
          # name - that carries its real mixed case (PurpleFox-07/marrquee),
          # and GHCR rejects uppercase image paths.
          images: ghcr.io/purplefox-07/marrquee
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Written out on purpose: this label is what makes the published
          # package's page on GitHub link back to the project page. The action
          # would also derive it on its own, but a stated value can be read
          # here and is pinned by a test.
          labels: |
            org.opencontainers.image.source=https://github.com/PurpleFox-07/marrquee

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published tag lists both platforms
        if: github.event_name == 'push'
        run: |
          output=$(docker buildx imagetools inspect ghcr.io/purplefox-07/marrquee:latest)
          echo "$output"
          echo "$output" | grep -q "linux/amd64"
          echo "$output" | grep -q "linux/arm64"

  # This is the acceptance vehicle for every "unverifiable by reading"
  # condition the deploy engine carries: real Docker, real arr images, a
  # real deploy driven the exact way the owner's own first NAS commands
  # will drive it. It pulls three external images and can go red for
  # reasons that have nothing to do with this repository's own code (a
  # registry hiccup, a slow image pull) - so, deliberately, it `needs: test`
  # alone and is never in `image`'s `needs:`, and `image` is never in this
  # job's `needs:` either. A red run here is loud (this job still fails, and
  # the whole workflow shows red) but it never holds back `:latest`.
  stack-smoke:
    name: Real-Docker stack smoke (two arr apps, then add one from the Hub, then a VPN with a throwaway login)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image for the stack smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marrquee:stack-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh, empty folder on the runner's own disk - never inside the
      # repository checkout - so a fresh-start refusal can never fire here.
      - name: Create a fresh storage root under the runner's temp directory
        run: mkdir -p "$RUNNER_TEMP/marrquee-smoke/media"

      # Started the same way `compose.install.yaml` starts it, but mirroring
      # its partial-mount shape rather than a whole-drive one: the socket,
      # the port, and the runner's own temp root mounted at `/host` plus
      # that same path. That's the exact "host path X lands at /host/X"
      # mapping the NAS now uses, so this proves it against a mount that
      # only covers part of the host, not `/:/host`, while still reaching
      # the storage root created just above.
      - name: Start the built image the way the install file does
        run: |
          docker run -d --name marrquee-stack-smoke \
            -p 7788:7788 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/host${RUNNER_TEMP}" \
            marrquee:stack-smoke

      - name: Wait for Marrquee to answer /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 60s"
          docker logs marrquee-stack-smoke
          exit 1

      # A throwaway login, generated fresh for this one run and masked
      # immediately - it's the same username and password every app in this
      # job will end up asking for, so it has to reach the install body,
      # but it must never land in the job log.
      - name: Generate a throwaway login for this run
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "MARRQUEE_CI_PASSWORD=$pw" >> "$GITHUB_ENV"

      # The API only ever sees a HOST path - Marrquee translates it to
      # `<host_mount>/<that path>` internally, and the generated compose
      # file carries this exact host path back out again. Radarr is
      # deliberately left out of this first install - this job's whole
      # point is proving it arrives later, through the Hub's own add
      # endpoint, onto a stack that is already running.
      - name: Install two apps against the runner's own temp folder
        run: |
          curl -fsS -X POST http://127.0.0.1:7788/api/install \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"${RUNNER_TEMP}/marrquee-smoke/media\",\"app_ids\":[\"prowlarr\",\"sonarr\"],\"login\":{\"username\":\"marrquee-ci\",\"password\":\"${MARRQUEE_CI_PASSWORD}\"}}"

      - name: Start the deploy
        run: curl -fsS -X POST http://127.0.0.1:7788/api/deploy

      # Generous on purpose: this is the first time all three images are
      # ever pulled, on a shared runner with no cache for them.
      #
      # On failure, the snapshot's own `code` and `headline` land straight
      # in a `::error::` annotation - GitHub's public annotations API is
      # readable without a login, unlike the job log itself, and both
      # fields are already plain-language and secret-free by the API's own
      # contract (see routes/api.py - only /api/deploy/diagnostics ever
      # carries technical detail).
      - name: Poll GET /api/deploy until it reaches finale (8+ minute budget)
        run: |
          for _ in $(seq 1 260); do
            body=$(curl -fsS http://127.0.0.1:7788/api/deploy)
            phase=$(echo "$body" | jq -r '.phase')
            echo "deploy phase: $phase"
            if [ "$phase" = "finale" ]; then
              exit 0
            fi
            if [ "$phase" = "error" ]; then
              code=$(echo "$body" | jq -r '.failure.code // "unknown"')
              headline=$(echo "$body" | jq -r '.headline // "the deploy reported an error"')
              MESSAGE="the deploy reached error (${code}): ${headline}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the deploy never reached finale in time"
          exit 1

      # A real daemon is the only way to prove `compose up -d --no-recreate
      # <service>` leaves an already-running container's identity alone.
      # Recorded now, before Radarr ever exists, so the add can be judged
      # against a real baseline instead of an assumption.
      - name: Record Prowlarr and Sonarr's container id and start time before the add
        run: |
          prowlarr_before=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' prowlarr)
          sonarr_before=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' sonarr)
          echo "prowlarr before: $prowlarr_before"
          echo "sonarr before: $sonarr_before"
          echo "PROWLARR_BEFORE=$prowlarr_before" >> "$GITHUB_ENV"
          echo "SONARR_BEFORE=$sonarr_before" >> "$GITHUB_ENV"

      # Adds one app to an already-running stack through the Hub's own
      # endpoint, never a second full deploy.
      - name: Add Radarr to the running stack through the Hub's install endpoint
        run: |
          response=$(curl -s -w '\n%{http_code}' -X POST \
            http://127.0.0.1:7788/api/hub/apps/radarr/install \
            -H "Content-Type: application/json" \
            -d '{"answers":{}}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "hub install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/radarr/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

      - name: Poll GET /api/hub/status until Radarr finishes adding (5 minute budget)
        run: |
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            radarr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "radarr")')
            state=$(echo "$radarr" | jq -r '.state')
            add_state=$(echo "$radarr" | jq -r '.add_state')
            busy=$(echo "$status" | jq -r '.busy')
            line=$(echo "$radarr" | jq -r '.line')
            echo "radarr state: $state / add_state: $add_state / busy: $busy"
            if [ "$add_state" = "error" ]; then
              MESSAGE="adding Radarr failed: ${line}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            if [ "$state" = "up" ] && [ "$add_state" = "null" ] && [ "$busy" = "false" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Radarr never finished adding to the running stack within 5 minutes"
          exit 1

      # The recreate check itself: adding Radarr must never recreate a
      # container that was already running.
      - name: Assert Prowlarr and Sonarr were not recreated by adding Radarr
        run: |
          prowlarr_after=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' prowlarr)
          sonarr_after=$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' sonarr)
          echo "prowlarr after: $prowlarr_after"
          echo "sonarr after: $sonarr_after"
          if [ "$prowlarr_after" != "$PROWLARR_BEFORE" ] || [ "$sonarr_after" != "$SONARR_BEFORE" ]; then
            echo "::error::Prowlarr or Sonarr was recreated by adding Radarr"
            exit 1
          fi

      - name: Assert all three containers are running
        run: |
          for name in prowlarr sonarr radarr; do
            docker ps --filter "name=^${name}$" --format '{{.Names}}' | grep -qx "$name"
          done

      # This is the regression this whole job exists to catch: every app
      # container, and Marrquee's own, must share the `marrquee` network -
      # not just have a network of that name sitting unused alongside them.
      - name: Assert the marrquee network lists all three apps and Marrquee itself
        run: |
          members=$(docker network inspect marrquee --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "marrquee network members: $members"
          for name in prowlarr sonarr radarr marrquee-stack-smoke; do
            echo "$members" | grep -qw "$name"
          done

      # write_compose chowns this file to the drive's own owner (not root)
      # specifically so it can be read - by the owner on their NAS, and by
      # this very step here. Asserted on its own, before the step that reads
      # it, so a regression here is named instead of surfacing as a
      # mysterious 401 two steps later.
      - name: Assert the compose file is readable by the current user
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          if [ ! -r "$compose_file" ]; then
            echo "::error::$compose_file is not readable by $(whoami) - write_compose's chown regressed"
            ls -l "$compose_file" || true
            exit 1
          fi

      # The API never exposes an app's key - it is read here straight off
      # the generated compose file on the runner's own disk, the same file
      # the owner is told to open and read in the README. Never echoed.
      - name: Assert each app answers system/status with the key from its own compose file
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ]; then
            echo "::error::could not read Prowlarr's API key out of the compose file"
            exit 1
          fi
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi
          if [ -z "$radarr_key" ]; then
            echo "::error::could not read Radarr's API key out of the compose file"
            exit 1
          fi
          curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/system/status
          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/system/status
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/system/status

      - name: Assert the expected folders exist inside the chosen root
        run: |
          root="$RUNNER_TEMP/marrquee-smoke/media"
          test -d "$root/data/torrents/tv"
          test -d "$root/data/torrents/movies"
          test -d "$root/data/media/tv"
          test -d "$root/data/media/movies"
          test -f "$root/marrquee/compose.yaml"
          test -f "$root/marrquee/marrquee-root.json"

      # This is the proof the whole story exists for: adding an application
      # in Prowlarr is a live, two-directional connection test (both
      # containers really do have to see each other, or Prowlarr refuses to
      # save it) - so a passing assertion here means the apps are genuinely
      # wired together, not just that a setting was written somewhere.
      - name: Assert Prowlarr, Sonarr and Radarr are wired together
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ] || [ -z "$sonarr_key" ] || [ -z "$radarr_key" ]; then
            echo "::error::could not read every app's API key out of the compose file"
            exit 1
          fi

          applications=$(curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/applications)
          echo "$applications" | jq -e 'length == 2' > /dev/null
          echo "$applications" | jq -e '[.[].implementation] | sort == ["Radarr", "Sonarr"]' > /dev/null
          echo "$applications" | jq -e '[.[].syncLevel] | all(. == "fullSync")' > /dev/null

          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/rootfolder \
            | jq -e '[.[].path] | any(endswith("/data/media/tv"))' > /dev/null
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/rootfolder \
            | jq -e '[.[].path] | any(endswith("/data/media/movies"))' > /dev/null

          curl -fsS http://127.0.0.1:7788/api/deploy \
            | jq -e '[.wiring[].state] | length > 0 and all(. == "done")' > /dev/null

      # The one proof reading the arr apps' source can't settle: does the
      # real `:latest` image actually accept a login through `config/host`,
      # and does its own `/login` page actually enforce it - the right
      # password gets in, a wrong one is refused. Never echoes the password;
      # it only ever appears inside a `--data-urlencode` argument.
      - name: Assert every app asks for the one login
        run: |
          set -euo pipefail
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ] || [ -z "$sonarr_key" ] || [ -z "$radarr_key" ]; then
            echo "::error::could not read every app's API key out of the compose file"
            exit 1
          fi

          assert_app_asks_for_the_login() {
            app_name="$1"
            port="$2"
            api_version="$3"
            api_key="$4"

            host_config=$(curl -fsS -H "X-Api-Key: ${api_key}" "http://127.0.0.1:${port}/api/${api_version}/config/host")
            if ! echo "$host_config" \
              | jq -e '.authenticationMethod=="forms" and .authenticationRequired=="enabled" and .username=="marrquee-ci"' \
              > /dev/null
            then
              echo "::error::${app_name} did not take the one login"
              exit 1
            fi

            good_redirect=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST \
              --data-urlencode "username=marrquee-ci" \
              --data-urlencode "password=${MARRQUEE_CI_PASSWORD}" \
              "http://127.0.0.1:${port}/login?returnUrl=%2F")
            if echo "$good_redirect" | grep -q "loginFailed=true"; then
              echo "::error::${app_name} did not take the one login"
              exit 1
            fi

            bad_redirect=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST \
              --data-urlencode "username=marrquee-ci" \
              --data-urlencode "password=definitely-the-wrong-password" \
              "http://127.0.0.1:${port}/login?returnUrl=%2F")
            if ! echo "$bad_redirect" | grep -q "loginFailed=true"; then
              echo "::error::${app_name} did not take the one login"
              exit 1
            fi
          }

          assert_app_asks_for_the_login "Prowlarr" 9696 v1 "$prowlarr_key"
          assert_app_asks_for_the_login "Sonarr" 8989 v3 "$sonarr_key"
          assert_app_asks_for_the_login "Radarr" 7878 v3 "$radarr_key"

      # The other proof reading source can't settle: an already-running
      # app's environment settings win over its own settings file until its
      # container is recreated. Sonarr is put back into the shape it would
      # already be running in on a real NAS before this login feature
      # existed - `External` / `DisabledForLocalAddresses` - by writing a
      # `sed`-adjusted copy of compose.yaml to a runner temp file (Marrquee's
      # own file is only ever read here, never written to) and bringing that
      # copy up directly through the runner's own compose. Choosing a login
      # from the Hub then has to recreate Sonarr alone to switch it back,
      # leaving Prowlarr and Radarr - whose running settings never diverged
      # from what is already on disk - untouched.
      - name: A Cycle-1 app switches over from the Hub
        run: |
          set -euo pipefail
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          cycle1_compose="$RUNNER_TEMP/cycle1-compose.yaml"
          sed \
            -e 's/SONARR__AUTH__METHOD: "Forms"/SONARR__AUTH__METHOD: "External"/' \
            -e 's/SONARR__AUTH__REQUIRED: "Enabled"/SONARR__AUTH__REQUIRED: "DisabledForLocalAddresses"/' \
            "$compose_file" > "$cycle1_compose"

          sonarr_id_pre_switch=$(docker inspect -f '{{.Id}}' sonarr)
          docker compose -p marrquee-apps -f "$cycle1_compose" up -d sonarr

          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi

          # A freshly recreated container can take 10-30s to answer its own
          # API - far longer than the login applier's own retry budget - so
          # phase 1 of the login run below must never race it. Bounded to 3
          # minutes at a 2s cadence.
          sonarr_ready=false
          for _ in $(seq 1 90); do
            if curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/system/status > /dev/null 2>&1; then
              sonarr_ready=true
              break
            fi
            sleep 2
          done
          if [ "$sonarr_ready" != "true" ]; then
            echo "::error::Sonarr never came back after the Cycle-1 recreate"
            exit 1
          fi

          prowlarr_before=$(docker inspect -f '{{.Id}}' prowlarr)
          sonarr_before=$(docker inspect -f '{{.Id}}' sonarr)
          radarr_before=$(docker inspect -f '{{.Id}}' radarr)
          if [ "$sonarr_before" = "$sonarr_id_pre_switch" ]; then
            echo "::error::Sonarr was not recreated by the Cycle-1 switch-over - the runner's compose saw no config change"
            exit 1
          fi

          docker exec marrquee-stack-smoke rm -f /config/login.json

          banner=$(curl -fsS http://127.0.0.1:7788/api/hub/status | jq -r '.login_banner')
          if [ "$banner" != "choose" ]; then
            echo "::error::expected login_banner=choose after deleting login.json, got ${banner}"
            exit 1
          fi

          # No Origin, no Sec-Fetch-Site - curl sends neither, so this
          # reaches the route the same way a same-origin browser post would.
          curl -fsS -o /dev/null -X POST http://127.0.0.1:7788/hub/login \
            --data-urlencode "username=marrquee-ci" \
            --data-urlencode "password=${MARRQUEE_CI_PASSWORD}" \
            --data-urlencode "password_again=${MARRQUEE_CI_PASSWORD}"

          # 5 minute budget at a 2s cadence - generous because this is the
          # first time the login run has ever recreated a real container.
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            busy=$(echo "$status" | jq -r '.busy')
            banner=$(echo "$status" | jq -r '.login_banner')
            echo "login run: busy=$busy login_banner=$banner"
            if [ "$banner" = "pending" ]; then
              echo "::error::the login run left an app pending (login_banner=pending)"
              exit 1
            fi
            if [ "$busy" = "false" ] && [ "$banner" = "none" ]; then
              break
            fi
            sleep 2
          done
          status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
          busy=$(echo "$status" | jq -r '.busy')
          banner=$(echo "$status" | jq -r '.login_banner')
          if [ "$busy" != "false" ] || [ "$banner" != "none" ]; then
            echo "::error::the login run never finished within 5 minutes (busy=${busy} login_banner=${banner})"
            exit 1
          fi

          prowlarr_after=$(docker inspect -f '{{.Id}}' prowlarr)
          sonarr_after=$(docker inspect -f '{{.Id}}' sonarr)
          radarr_after=$(docker inspect -f '{{.Id}}' radarr)
          if [ "$prowlarr_after" != "$prowlarr_before" ]; then
            echo "::error::Choosing the login recreated Prowlarr"
            exit 1
          fi
          if [ "$radarr_after" != "$radarr_before" ]; then
            echo "::error::Choosing the login recreated Radarr"
            exit 1
          fi
          if [ "$sonarr_after" = "$sonarr_before" ]; then
            echo "::error::Sonarr's Cycle-1 container was never recreated by the login run"
            exit 1
          fi

          host_config=$(curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/config/host)
          if ! echo "$host_config" | jq -e '.authenticationMethod=="forms" and .authenticationRequired=="enabled"' > /dev/null; then
            echo "::error::Sonarr did not switch back to Forms after the login run"
            exit 1
          fi

      # "Twice is safe" only really means something proven against real
      # containers and a real Prowlarr database - re-running the whole
      # deploy must change nothing an owner could ever observe.
      - name: Deploy a second time to prove nothing changes
        run: curl -fsS -X POST http://127.0.0.1:7788/api/deploy

      - name: Poll GET /api/deploy until the second deploy reaches finale
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:7788/api/deploy)
            phase=$(echo "$body" | jq -r '.phase')
            echo "second deploy phase: $phase"
            if [ "$phase" = "finale" ]; then
              exit 0
            fi
            if [ "$phase" = "error" ]; then
              code=$(echo "$body" | jq -r '.failure.code // "unknown"')
              headline=$(echo "$body" | jq -r '.headline // "the deploy reported an error"')
              MESSAGE="the second deploy reached error (${code}): ${headline}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the second deploy never reached finale in time"
          exit 1

      - name: Assert the second deploy changed nothing observable
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')

          curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/applications \
            | jq -e 'length == 2' > /dev/null
          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/rootfolder \
            | jq -e 'length == 1' > /dev/null
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/rootfolder \
            | jq -e 'length == 1' > /dev/null
          curl -fsS http://127.0.0.1:7788/api/deploy \
            | jq -e '[.wiring[].state] | length > 0 and all(. == "done")' > /dev/null

      # The vehicle for the Pitch's one condition a Mac can't prove by
      # reading: on a real daemon, a running container's Docker-reported
      # state really does read as an Up poster with a working link. Run
      # last, after every earlier step that still needs Radarr running.
      - name: Assert the Hub shows every app Up and a link really opens
        run: |
          curl -fsS http://127.0.0.1:7788/ | grep -q 'data-hub'
          status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
          echo "$status" | jq -e '[.apps[].state] | length == 3 and all(. == "up")' > /dev/null

          sonarr_url=$(echo "$status" | jq -r '.apps[] | select(.app_id == "sonarr") | .url')
          if [ "$sonarr_url" != "http://127.0.0.1:8989/" ]; then
            echo "::error::Sonarr's poster url was '${sonarr_url}', expected http://127.0.0.1:8989/"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$sonarr_url")
          if [ "$code" = "000" ]; then
            echo "::error::Sonarr's poster link did not answer at all (curl returned 000)"
            exit 1
          fi

      # The other half of that same condition: a real `docker stop` really
      # does turn into an honest "Down - last seen just now" within the
      # Hub's own 15-second polling cadence, read here straight from the
      # live check both the page and this step share.
      - name: Stop Radarr and wait for the Hub to say Down
        run: |
          docker stop radarr
          for _ in $(seq 1 15); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            radarr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "radarr")')
            state=$(echo "$radarr" | jq -r '.state')
            line=$(echo "$radarr" | jq -r '.line')
            echo "radarr state: $state / line: $line"
            if [ "$state" = "down" ] && echo "$line" | grep -q "last seen"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Radarr never read Down with a last-seen line within 30 seconds of docker stop"
          exit 1

      # Gluetun's own credential, generated fresh for this run and masked
      # immediately - deliberately a SEPARATE variable from
      # MARRQUEE_CI_PASSWORD (the one every arr app shares), so a leak of
      # one can never be mistaken for a leak of the other two steps down.
      - name: Generate a throwaway VPN login
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "MARRQUEE_CI_VPN_PASSWORD=$pw" >> "$GITHUB_ENV"

      # Gluetun has no wizard or "+" tile of its own - the Hub's own install
      # endpoint is the only door in. It requires a login to already be
      # chosen and the deploy manager to be idle, both already true by this
      # point in the job. A fake ProtonVPN login can never actually connect
      # - that's the point of this whole job: it proves the tunnel device
      # and capability land on the container itself, and (a few steps down)
      # that the failure is reported in plain words instead of a spinner.
      # The container is created asynchronously by the add run, so `docker
      # inspect` is retried rather than assumed to be ready the instant the
      # 202 comes back.
      - name: Add the VPN with a throwaway login
        run: |
          response=$(curl -s -w '\n%{http_code}' -X POST \
            http://127.0.0.1:7788/api/hub/apps/gluetun/install \
            -H "Content-Type: application/json" \
            -d "{\"answers\":{\"provider\":\"protonvpn\",\"vpn_type\":\"openvpn\",\"openvpn_user\":\"marrquee-ci-not-a-user\",\"openvpn_password\":\"${MARRQUEE_CI_VPN_PASSWORD}\"}}")
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "hub install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/gluetun/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

          gluetun_ready=false
          for _ in $(seq 1 30); do
            if docker inspect gluetun > /dev/null 2>&1; then
              gluetun_ready=true
              break
            fi
            sleep 2
          done
          if [ "$gluetun_ready" != "true" ]; then
            echo "::error::Gluetun's container never appeared within 60 seconds of the install call"
            exit 1
          fi

          cap_add=$(docker inspect -f '{{json .HostConfig.CapAdd}}' gluetun)
          devices=$(docker inspect -f '{{json .HostConfig.Devices}}' gluetun)
          echo "gluetun CapAdd: $cap_add"
          echo "gluetun Devices: $devices"
          if ! echo "$cap_add" | grep -q "NET_ADMIN"; then
            echo "::error::Gluetun did not get the tunnel device"
            exit 1
          fi
          if ! echo "$devices" | grep -q '"PathOnHost":"/dev/net/tun"'; then
            echo "::error::Gluetun did not get the tunnel device"
            exit 1
          fi

      # A fake login can never connect - it either shows up as AUTH_FAILED
      # in Gluetun's own log (vpn_refused) or, if that never surfaces
      # cleanly against a throwaway ProtonVPN account, times out at
      # Gluetun's own 120-second budget (vpn_not_connected). Both are
      # accepted here; what must never happen is the Hub reporting a fake
      # login as connected.
      - name: Poll GET /api/hub/status until the VPN's add reports its plain failure (4 minute budget)
        run: |
          add_state=""
          line=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            gluetun=$(echo "$status" | jq -c '.apps[] | select(.app_id == "gluetun")')
            state=$(echo "$gluetun" | jq -r '.state')
            add_state=$(echo "$gluetun" | jq -r '.add_state')
            line=$(echo "$gluetun" | jq -r '.line')
            echo "gluetun state: $state / add_state: $add_state"
            if [ "$state" = "up" ]; then
              echo "::error::A fake VPN login was reported as connected"
              exit 1
            fi
            if [ "$add_state" = "error" ]; then
              break
            fi
            sleep 2
          done
          if [ "$add_state" != "error" ]; then
            echo "::error::Gluetun's add never reached add_state=error within 4 minutes"
            exit 1
          fi
          echo "GLUETUN_LINE=$line" >> "$GITHUB_ENV"

      # The tile's `line` is `headline + " " + what_to_do` (hub.py's
      # `_add_failure_line`) - split the two candidate sentences the same
      # way, inside the container, so this compares against exactly what
      # the running code would say rather than a copy pasted into the
      # workflow.
      - name: Assert the VPN failure is one of the two plain sentences
        run: |
          cat > "$RUNNER_TEMP/vpn_expected_lines.py" <<'PY'
          from marrquee.deploy import DeployManager, _split_failure_text
          from marrquee.vpn import find_provider
          from marrquee.words import failure_vpn_not_connected, failure_vpn_refused

          company = find_provider("protonvpn")
          assert company is not None
          minutes = round(DeployManager.TUNNEL_NEVER_UP_AFTER_SECONDS / 60)

          headline, what_to_do = _split_failure_text(failure_vpn_refused(company.label))
          print(f"{headline} {what_to_do}")

          headline, what_to_do = _split_failure_text(failure_vpn_not_connected(minutes))
          print(f"{headline} {what_to_do}")
          PY

          docker cp "$RUNNER_TEMP/vpn_expected_lines.py" marrquee-stack-smoke:/tmp/vpn_expected_lines.py
          expected=$(docker exec marrquee-stack-smoke python /tmp/vpn_expected_lines.py)
          echo "expected sentences:"
          echo "$expected"
          if ! echo "$expected" | grep -qxF "$GLUETUN_LINE"; then
            echo "::error::the failed VPN tile's line matched neither the vpn_refused nor the vpn_not_connected sentence"
            exit 1
          fi
          echo "::notice::the fake VPN login failed as expected: $GLUETUN_LINE"

      # Gluetun's control server treats every route as private by default -
      # proven here with no VPN account at all: a request with no key is
      # refused, and the key Marrquee generated and wrote into its own auth
      # file is accepted. Run from inside Marrquee's own container (root),
      # on the same Docker network Gluetun joins, reaching it by container
      # name the same way an app behind the tunnel would.
      - name: Assert Gluetun's control server wants Marrquee's key
        run: |
          cat > "$RUNNER_TEMP/vpn_control_auth_check.py" <<'PY'
          import asyncio
          import json

          import httpx


          async def main() -> None:
              async with httpx.AsyncClient(timeout=5.0) as client:
                  unauthenticated = await client.get("http://gluetun:8000/v1/vpn/status")
                  if unauthenticated.status_code != 401:
                      raise SystemExit(
                          f"no key: expected 401, got {unauthenticated.status_code}"
                      )

                  with open("/config/install.json", encoding="utf-8") as handle:
                      install = json.load(handle)
                  api_key = install["api_keys"]["gluetun"]
                  if not api_key:
                      raise SystemExit("gluetun has no api key in install.json")

                  authenticated = await client.get(
                      "http://gluetun:8000/v1/vpn/status", headers={"X-API-Key": api_key}
                  )
                  if authenticated.status_code != 200:
                      raise SystemExit(
                          f"with key: expected 200, got {authenticated.status_code}"
                      )
                  body = authenticated.json()
                  if "status" not in body:
                      raise SystemExit(f"with key: response carried no status field: {body!r}")


          asyncio.run(main())
          PY

          docker cp "$RUNNER_TEMP/vpn_control_auth_check.py" marrquee-stack-smoke:/tmp/vpn_control_auth_check.py
          if ! output=$(docker exec marrquee-stack-smoke python /tmp/vpn_control_auth_check.py 2>&1); then
            echo "$output"
            MESSAGE="Gluetun's control server auth check failed: ${output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$output"

      # A fake login never proves the tunnel, but the kill switch must hold
      # regardless - this waits for Gluetun's own restart-on-failure loop to
      # land on a running container before the pair below, so a missing
      # container can never make `--network container:gluetun` fail for an
      # unrelated reason and pass vacuously.
      - name: Assert Gluetun's container is running before the kill-switch check
        run: |
          running=false
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Running}}' gluetun 2>/dev/null || echo "false")
            if [ "$state" = "true" ]; then
              running=true
              break
            fi
            sleep 2
          done
          if [ "$running" != "true" ]; then
            echo "::error::Gluetun's container was not running before the kill-switch check - it would pass vacuously"
            exit 1
          fi

      # Gluetun's firewall only lets traffic out through the tunnel
      # (FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT="on", written
      # out explicitly rather than left as an implicit default) - proven
      # here against a real daemon: a container sharing Gluetun's network
      # namespace cannot reach the open internet while the tunnel is down,
      # while the runner's own network can.
      - name: Assert nothing gets out without the tunnel
        run: |
          if ! docker run --rm alpine:3.20 wget -q -T 5 -O /dev/null http://1.1.1.1; then
            echo "::error::the runner itself could not reach 1.1.1.1 - the kill-switch control case is invalid"
            exit 1
          fi

          # A positive control through the SAME namespace the real check
          # below is judged in: Gluetun's own control server, on loopback,
          # is never subject to Gluetun's own firewall, so it must always
          # answer - proving `--network container:gluetun` really did join
          # Gluetun's namespace before a "couldn't reach 1.1.1.1" result is
          # trusted to mean the kill switch. `docker run` itself failing to
          # join that namespace is Docker's own 125+ exit convention,
          # judged separately from busybox wget's own exit codes below.
          # `|| control_exit=$?` rather than a separate `control_exit=$?`
          # line: GitHub runs this step as `bash -e`, which would end the
          # step on the expected nonzero exit (the control server answers
          # 401 without Marrquee's key) before a separate line could run.
          control_exit=0
          docker run --rm --network container:gluetun alpine:3.20 \
            wget -q -T 5 -S -O /dev/null http://127.0.0.1:8000/v1/vpn/status \
            > "$RUNNER_TEMP/kill_switch_positive_control.log" 2>&1 || control_exit=$?
          if [ "$control_exit" -ge 125 ]; then
            echo "::error::the kill-switch check could not run (docker exit ${control_exit})"
            cat "$RUNNER_TEMP/kill_switch_positive_control.log"
            exit 1
          fi
          if ! grep -qE "HTTP/[0-9.]+ [0-9]+" "$RUNNER_TEMP/kill_switch_positive_control.log"; then
            echo "::error::the kill-switch check's positive control got no HTTP response through Gluetun's shared network namespace - the probe or the namespace itself is broken, not the VPN"
            cat "$RUNNER_TEMP/kill_switch_positive_control.log"
            exit 1
          fi

          # The real check: judged by exit code, never by `if cmd; then`
          # truthiness, so `docker run` itself failing (can't join the
          # namespace) can never read the same as "blocked by the
          # firewall" - the bug this whole block hardens against.
          real_exit=0
          docker run --rm --network container:gluetun alpine:3.20 wget -q -T 5 -O /dev/null http://1.1.1.1 || real_exit=$?
          if [ "$real_exit" -ge 125 ]; then
            echo "::error::the kill-switch check could not run (docker exit ${real_exit})"
            exit 1
          fi
          if [ "$real_exit" -eq 0 ]; then
            echo "::error::Traffic left through the kill switch"
            exit 1
          fi

      # The VPN login goes into Gluetun's own root-only secret files, never
      # into compose.yaml (which this very job already proved is readable
      # by the runner) or the diagnostics endpoint.
      - name: Assert the VPN login stays out of compose.yaml and diagnostics
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          diagnostics=$(curl -fsS http://127.0.0.1:7788/api/deploy/diagnostics || true)
          for needle in "marrquee-ci-not-a-user" "$MARRQUEE_CI_VPN_PASSWORD"; do
            if grep -qF "$needle" "$compose_file"; then
              echo "::error::the VPN login appears in compose.yaml"
              exit 1
            fi
            if echo "$diagnostics" | grep -qF "$needle"; then
              echo "::error::the VPN login appears in the diagnostics endpoint"
              exit 1
            fi
          done

      # The runner mounts its own temp root at /host<that same path> inside
      # Marrquee's container - so the secrets folder (root-only, written by
      # the root container) is checked from INSIDE that container, never by
      # the unprivileged runner, which the folder's own mode must keep out.
      - name: Assert the VPN secrets folder is root-only
        run: |
          secrets_dir="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/vpn"
          dir_perms=$(docker exec marrquee-stack-smoke stat -c '%a %u' "$secrets_dir")
          echo "vpn secrets folder: $dir_perms"
          if [ "$dir_perms" != "700 0" ]; then
            echo "::error::the VPN secrets folder was not 700 root (got: ${dir_perms})"
            exit 1
          fi

          files=$(docker exec marrquee-stack-smoke sh -c "ls -A '${secrets_dir}'")
          if [ -z "$files" ]; then
            echo "::error::the VPN secrets folder had no files to check"
            exit 1
          fi
          while IFS= read -r name; do
            file_perms=$(docker exec marrquee-stack-smoke stat -c '%a %u' "${secrets_dir}/${name}")
            echo "vpn secret file ${name}: ${file_perms}"
            if [ "$file_perms" != "600 0" ]; then
              echo "::error::${name} in the VPN secrets folder was not 600 root (got: ${file_perms})"
              exit 1
            fi
          done <<< "$files"

      # qBittorrent's own add path always brings up Gluetun behind a PROVEN
      # tunnel first - Gluetun's fake login above never gets there. This
      # block is Marrquee's own bring-up and wiring code, exercised
      # directly against the failed-add Gluetun already running here, so
      # the pieces a Mac reading source can't settle (the real image
      # reading the pre-written key, the real one-login POST, a real
      # Sonarr's own connection test) still get proven on a real daemon.
      - name: Assert Gluetun is still running before qBittorrent joins its network
        run: |
          running=false
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Running}}' gluetun 2>/dev/null || echo "false")
            if [ "$state" = "true" ]; then
              running=true
              break
            fi
            sleep 2
          done
          if [ "$running" != "true" ]; then
            echo "::error::Gluetun's container was not running before qBittorrent joined its network - the checks below would run against a network that isn't really shared"
            exit 1
          fi

      # `with_app_added` and `write_qbit_conf` run entirely in memory and
      # against qBittorrent's own config folder - `install.json` on disk is
      # never touched, so this developer-only compose file never becomes
      # part of the real install. The key itself never reaches stdout,
      # only its length; later steps read it back straight off
      # `/config/ci-qbit-key.json`, over their own `docker exec`, the same
      # root-only-file pattern the VPN secrets already use.
      - name: qBittorrent inside the VPN's network (developer test)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ci_qbit_bring_up.py" <<'PY'
          import json
          from pathlib import Path, PurePosixPath

          from marrquee.compose import build_stack_plan, render_compose
          from marrquee.config import Settings
          from marrquee.install import with_app_added
          from marrquee.qbittorrent import write_qbit_conf
          from marrquee.questions import load_answers
          from marrquee.state import load_state

          settings = Settings.from_env()
          state = load_state(settings.config_dir)
          if state is None:
              raise SystemExit("no install.json to grow")
          answers = load_answers(settings.config_dir)

          grown = with_app_added(state, "qbittorrent")
          api_key = grown.api_keys["qbittorrent"]

          write_qbit_conf(
              settings, PurePosixPath(state.storage_root), api_key, grown.puid, grown.pgid
          )

          plan = build_stack_plan(grown, answers)
          Path("/config/ci-qbit-compose.yaml").write_text(render_compose(plan))
          Path("/config/ci-qbit-key.json").write_text(json.dumps({"qbittorrent": api_key}))
          print(f"qbittorrent key length: {len(api_key)}")
          PY

          docker cp "$RUNNER_TEMP/ci_qbit_bring_up.py" marrquee-stack-smoke:/tmp/ci_qbit_bring_up.py
          docker exec marrquee-stack-smoke python /tmp/ci_qbit_bring_up.py

          docker cp marrquee-stack-smoke:/config/ci-qbit-compose.yaml "$RUNNER_TEMP/ci-qbit-compose.yaml"
          if ! docker compose -p marrquee-apps -f "$RUNNER_TEMP/ci-qbit-compose.yaml" up -d --no-recreate qbittorrent; then
            echo "::error::docker compose up -d --no-recreate qbittorrent failed"
            exit 1
          fi

          network_mode=$(docker inspect -f '{{.HostConfig.NetworkMode}}' qbittorrent)
          echo "qbittorrent network mode: $network_mode"
          if [[ "$network_mode" != container:* ]]; then
            echo "::error::qBittorrent is not inside the VPN's network"
            exit 1
          fi

          running=false
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Running}}' qbittorrent 2>/dev/null || echo "false")
            if [ "$state" = "true" ]; then
              running=true
              break
            fi
            sleep 2
          done
          if [ "$running" != "true" ]; then
            echo "::error::qBittorrent's container never reached Running before the checks below drove Marrquee against it"
            exit 1
          fi

      # qBittorrent's WebUI can take a few seconds to bind after the
      # container reports Running, so this polls rather than asserting a
      # single request - the same shape every other readiness wait in this
      # job already uses.
      - name: qBittorrent takes Marrquee's key
        run: |
          cat > "$RUNNER_TEMP/ci_qbit_key_check.py" <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from marrquee.wiring.qbit_client import HttpQbitClient

          _BASE_URL = "http://gluetun:8080"
          _PATH = "api/v2/app/version"


          async def main() -> None:
              api_key = json.loads(Path("/config/ci-qbit-key.json").read_text())["qbittorrent"]
              client = HttpQbitClient()

              status = 0
              for _ in range(60):
                  response = await client.request("GET", _BASE_URL, _PATH, api_key)
                  status = response.status
                  if status == 200:
                      break
                  await asyncio.sleep(2)
              if status != 200:
                  raise SystemExit(f"key: expected 200 within 2 minutes, last status was {status}")

              # Same shape, guaranteed different: the real key's own alphabet
              # never includes "0" (`apikey.cpp`'s ambiguity-free set).
              wrong_key = "qbt_" + "0" * 28
              wrong = await client.request("GET", _BASE_URL, _PATH, wrong_key)
              if wrong.status not in (401, 403):
                  raise SystemExit(f"wrong key: expected 401 or 403, got {wrong.status}")


          asyncio.run(main())
          PY

          docker cp "$RUNNER_TEMP/ci_qbit_key_check.py" marrquee-stack-smoke:/tmp/ci_qbit_key_check.py
          if ! output=$(docker exec marrquee-stack-smoke python /tmp/ci_qbit_key_check.py 2>&1); then
            echo "$output"
            MESSAGE="qBittorrent's key check failed: ${output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$output"

      # Reuses the same throwaway login every arr app in this job already
      # took - qBittorrent gets it through its key instead of a cookie
      # session, never its own old password. The password only ever
      # appears inside `docker exec -e`, never printed.
      - name: qBittorrent takes the one login
        run: |
          cat > "$RUNNER_TEMP/ci_qbit_login_check.py" <<'PY'
          import asyncio
          import dataclasses
          import json
          import os
          from pathlib import Path

          import httpx

          from marrquee.catalog import get_app
          from marrquee.config import Settings
          from marrquee.install import with_app_added
          from marrquee.login import SavedLogin
          from marrquee.login_apply import HttpLoginApplier
          from marrquee.state import load_state


          def _grown_with_key(state, api_key):
              seeded = dataclasses.replace(
                  state, api_keys={**state.api_keys, "qbittorrent": api_key}
              )
              return with_app_added(seeded, "qbittorrent")


          async def main() -> None:
              settings = Settings.from_env()
              state = load_state(settings.config_dir)
              if state is None:
                  raise SystemExit("no install.json to read")
              api_key = json.loads(Path("/config/ci-qbit-key.json").read_text())["qbittorrent"]
              grown = _grown_with_key(state, api_key)

              password = os.environ["MARRQUEE_CI_PASSWORD"]
              login = SavedLogin("marrquee-ci", 1, password)
              result = await HttpLoginApplier().apply(get_app("qbittorrent"), grown, login)
              if not result.ok:
                  raise SystemExit(f"HttpLoginApplier did not apply the login: {result.technical}")

              async with httpx.AsyncClient(timeout=10.0) as client:
                  good = await client.post(
                      "http://gluetun:8080/api/v2/auth/login",
                      data={"username": "marrquee-ci", "password": password},
                  )
                  if good.text != "Ok.":
                      raise SystemExit("the right password did not log in")

                  bad = await client.post(
                      "http://gluetun:8080/api/v2/auth/login",
                      data={"username": "marrquee-ci", "password": "definitely-the-wrong-password"},
                  )
                  if bad.text == "Ok.":
                      raise SystemExit("a wrong password still logged in")


          asyncio.run(main())
          PY

          docker cp "$RUNNER_TEMP/ci_qbit_login_check.py" marrquee-stack-smoke:/tmp/ci_qbit_login_check.py
          if ! output=$(docker exec -e MARRQUEE_CI_PASSWORD="$MARRQUEE_CI_PASSWORD" marrquee-stack-smoke python /tmp/ci_qbit_login_check.py 2>&1); then
            echo "$output"
            MESSAGE="qBittorrent's one-login check failed: ${output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$output"

      # The one proof reading source can't settle for this story: Sonarr's
      # own POST runs its own live connection test against qBittorrent
      # before it ever saves the client, so a 201 here means Sonarr really
      # did reach qBittorrent through Gluetun's network, key and all,
      # while the tunnel itself is still down.
      - name: Sonarr connects to qBittorrent with the key while the tunnel is down
        run: |
          set -euo pipefail
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_qbit_wiring_check.py" <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path

          from marrquee.catalog import get_app
          from marrquee.wiring.arr_client import HttpArrClient
          from marrquee.wiring.qbit_client import HttpQbitClient
          from marrquee.wiring.steps import ensure_download_client, ensure_qbit_category


          async def main() -> None:
              qbit_key = json.loads(Path("/config/ci-qbit-key.json").read_text())["qbittorrent"]
              sonarr_key = os.environ["SONARR_API_KEY"]

              qbit = HttpQbitClient()
              arr = HttpArrClient()
              qbittorrent = get_app("qbittorrent")
              sonarr = get_app("sonarr")

              present = ("gluetun", "qbittorrent")
              category = await ensure_qbit_category(
                  qbit,
                  qbittorrent,
                  qbit_key,
                  media_folder="tv",
                  save_path="/data/torrents/tv",
                  present=present,
              )
              if category.state != "done":
                  raise SystemExit(f"ensure_qbit_category did not finish: {category}")

              client_result = await ensure_download_client(
                  arr,
                  sonarr,
                  sonarr_key,
                  qbittorrent,
                  qbit_key,
                  category_field="tvCategory",
                  category="tv",
                  present=present,
              )
              if client_result.state != "done":
                  raise SystemExit(f"ensure_download_client did not finish: {client_result}")


          asyncio.run(main())
          PY

          docker cp "$RUNNER_TEMP/ci_qbit_wiring_check.py" marrquee-stack-smoke:/tmp/ci_qbit_wiring_check.py
          if ! output=$(docker exec -e SONARR_API_KEY="$sonarr_key" marrquee-stack-smoke python /tmp/ci_qbit_wiring_check.py 2>&1); then
            echo "$output"
            MESSAGE="Sonarr never connected to qBittorrent: ${output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$output"

          response=$(curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/downloadclient)
          if ! echo "$response" | jq -e '[.[] | select(.implementation == "QBittorrent")] | length == 1' > /dev/null; then
            echo "::error::Sonarr's downloadclient list has no QBittorrent entry"
            exit 1
          fi
          if ! echo "$response" \
            | jq -e '[.[] | select(.implementation == "QBittorrent")][0].fields[] | select(.name == "host") | .value == "gluetun"' \
            > /dev/null
          then
            echo "::error::Sonarr's qBittorrent client does not point at gluetun"
            exit 1
          fi
          if ! echo "$response" \
            | jq -e '[.[] | select(.implementation == "QBittorrent")][0].removeCompletedDownloads == true' \
            > /dev/null
          then
            echo "::error::Sonarr's qBittorrent client does not remove completed downloads"
            exit 1
          fi

      # The control case this job already proved with alpine: a container
      # sharing Gluetun's network namespace cannot reach the open internet
      # while the tunnel is down. qBittorrent is that same namespace,
      # proven directly this time rather than by a stand-in image.
      # A missing probe tool, a stopped container or `docker exec` itself
      # failing must never read as "the kill switch held" - each is judged
      # by its own captured exit code rather than an `if cmd; then`
      # truthiness test, and a positive control through the SAME shared
      # namespace (Gluetun's own control server, on loopback - never
      # subject to Gluetun's own firewall) proves the probe tool and the
      # namespace both work before a "couldn't connect" result below is
      # trusted to mean anything.
      - name: The downloader can't reach the internet
        run: |
          tool=""
          if docker exec qbittorrent sh -c 'command -v curl' > /dev/null 2>&1; then
            tool="curl"
          elif docker exec qbittorrent sh -c 'command -v wget' > /dev/null 2>&1; then
            tool="wget"
          else
            echo "::error::curl is not available in the qBittorrent container - the kill-switch check cannot run"
            exit 1
          fi
          echo "kill-switch probe tool: $tool"

          if [ "$tool" = "curl" ]; then
            control_code=$(docker exec qbittorrent curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/vpn/status || true)
            echo "positive control status: $control_code"
            if [ -z "$control_code" ] || [ "$control_code" = "000" ]; then
              echo "::error::the kill-switch check's positive control got no HTTP response through qBittorrent's shared network namespace - the probe tool or the namespace itself is broken, not the VPN"
              exit 1
            fi
          else
            docker exec qbittorrent wget -q -T 5 -S -O /dev/null http://127.0.0.1:8000/v1/vpn/status \
              > "$RUNNER_TEMP/qbit_kill_switch_control.log" 2>&1 || true
            if ! grep -qE "HTTP/[0-9.]+ [0-9]+" "$RUNNER_TEMP/qbit_kill_switch_control.log"; then
              echo "::error::the kill-switch check's positive control got no HTTP response through qBittorrent's shared network namespace - the probe tool or the namespace itself is broken, not the VPN"
              cat "$RUNNER_TEMP/qbit_kill_switch_control.log"
              exit 1
            fi
          fi

          if [ "$tool" = "curl" ]; then
            # `|| real_exit=$?`: this step runs as `bash -e`, and a blocked
            # tunnel is an expected nonzero exit.
            real_exit=0
            docker exec qbittorrent curl -s -m 5 -o /dev/null http://1.1.1.1 || real_exit=$?
            case "$real_exit" in
              7|28) echo "kill switch held (curl exit ${real_exit})" ;;
              0) echo "::error::qBittorrent reached the internet outside the VPN"; exit 1 ;;
              *) echo "::error::the kill-switch check failed for an unrelated reason (curl exit ${real_exit})"; exit 1 ;;
            esac
          else
            real_exit=0
            docker exec qbittorrent wget -q -T 5 -O /dev/null http://1.1.1.1 2>"$RUNNER_TEMP/qbit_kill_switch_real.log" || real_exit=$?
            if [ "$real_exit" -eq 0 ]; then
              echo "::error::qBittorrent reached the internet outside the VPN"
              exit 1
            fi
            if [ "$real_exit" -eq 1 ] \
              && grep -qiE "connection refused|timed out|network unreachable|can't connect|no route to host" "$RUNNER_TEMP/qbit_kill_switch_real.log"
            then
              echo "kill switch held (wget exit ${real_exit})"
            else
              echo "::error::the kill-switch check failed for an unrelated reason (wget exit ${real_exit})"
              cat "$RUNNER_TEMP/qbit_kill_switch_real.log"
              exit 1
            fi
          fi

      # qBittorrent shares Gluetun's network namespace, so it has to leave
      # before Gluetun's own container does - otherwise Gluetun's removal
      # below would either fail or leave qBittorrent's namespace dangling.
      - name: Remove qBittorrent ahead of Gluetun's own teardown
        run: docker rm -f qbittorrent

      - name: Cancel the VPN add
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/apps/gluetun/cancel)
          if [ "$code" != "303" ]; then
            echo "::error::POST /hub/apps/gluetun/cancel returned ${code}, expected 303"
            exit 1
          fi

      - name: Poll GET /api/hub/status until gluetun is fully removed (2 minute budget)
        run: |
          for _ in $(seq 1 60); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            if ! echo "$status" | jq -e '.apps[] | select(.app_id == "gluetun")' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::gluetun never left /api/hub/status after cancel within 2 minutes"
          exit 1

      - name: Assert cancel removed Gluetun's container and cleared its secrets
        run: |
          if docker inspect gluetun > /dev/null 2>&1; then
            echo "::error::gluetun's container still exists after cancel"
            exit 1
          fi
          secrets_dir="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/vpn"
          remaining=$(docker exec marrquee-stack-smoke sh -c "ls -A '${secrets_dir}'")
          if [ -n "$remaining" ]; then
            echo "::error::the VPN secrets folder still had files after cancel"
            exit 1
          fi

      # Radarr was stopped for the earlier "Down" proof and never started
      # again. Every wiring run below (adding qBittorrent, then moving it,
      # then restoring it) waits on EVERY installed app to answer before it
      # calls itself done - Radarr included - so a stopped Radarr would
      # cost each of those runs the engine's own 180-second ready timeout
      # for nothing. Restarting it here, once, keeps the rest of this job
      # fast instead of just eventually correct.
      - name: Start Radarr again and wait for the Hub to say Up
        run: |
          docker start radarr
          for _ in $(seq 1 30); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            state=$(echo "$status" | jq -r '.apps[] | select(.app_id == "radarr") | .state')
            echo "radarr state: $state"
            if [ "$state" = "up" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Radarr never read Up again within 60 seconds of docker start"
          exit 1

      # --- No-VPN mode: break the glass, add qBittorrent on its own network,
      # try to move it behind a VPN that can never really connect, then keep
      # it running without one. An earlier step in this same job already
      # wrote a real qBittorrent.conf with a key that only ever lived in
      # memory - write_qbit_conf never overwrites an existing file, so a
      # real add here would inherit a key nothing else ever saved. Wiping
      # the folder first is safe because that earlier step never touched
      # install.json.
      - name: Choose to run qBittorrent without a VPN (no-vpn move)
        run: |
          set -euo pipefail
          docker exec marrquee-stack-smoke rm -rf "/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/apps/qbittorrent"

          wrong_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/without-vpn \
            --data-urlencode "stage=3" --data-urlencode "typed=wrong")
          if [ "$wrong_code" != "200" ]; then
            echo "::error::a wrong sentence at break-glass stage 3 returned ${wrong_code}, expected 200"
            exit 1
          fi
          if docker exec marrquee-stack-smoke test -e /config/without_vpn.json; then
            echo "::error::a wrong sentence at break-glass stage 3 saved the confirmation file anyway"
            exit 1
          fi

          for stage in 1 2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/without-vpn \
              --data-urlencode "stage=${stage}")
            if [ "$code" != "200" ]; then
              echo "::error::break-glass stage ${stage} returned ${code}, expected 200"
              exit 1
            fi
          done

          phrase=$(docker exec marrquee-stack-smoke python3 -c \
            "from marrquee.words import WITHOUT_VPN_PHRASE; print(WITHOUT_VPN_PHRASE)")
          confirm_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/without-vpn \
            --data-urlencode "stage=3" --data-urlencode "typed=${phrase}")
          if [ "$confirm_code" != "303" ]; then
            echo "::error::the typed break-glass sentence returned ${confirm_code}, expected 303"
            exit 1
          fi
          if ! docker exec marrquee-stack-smoke test -e /config/without_vpn.json; then
            echo "::error::the typed break-glass confirmation never wrote without_vpn.json"
            exit 1
          fi

      - name: Add qBittorrent without a VPN
        run: |
          response=$(curl -s -w '\n%{http_code}' -X POST \
            http://127.0.0.1:7788/api/hub/apps/qbittorrent/install \
            -H "Content-Type: application/json" \
            -d '{"answers":{"seeding":"good_neighbor"}}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "hub install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/qbittorrent/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

      - name: Poll GET /api/hub/status until qBittorrent finishes adding without a VPN (5 minute budget)
        run: |
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            qbit=$(echo "$status" | jq -c '.apps[] | select(.app_id == "qbittorrent")')
            state=$(echo "$qbit" | jq -r '.state')
            add_state=$(echo "$qbit" | jq -r '.add_state')
            busy=$(echo "$status" | jq -r '.busy')
            line=$(echo "$qbit" | jq -r '.line')
            echo "qbittorrent state: $state / add_state: $add_state / busy: $busy"
            if [ "$add_state" = "error" ]; then
              MESSAGE="adding qBittorrent without a VPN failed: ${line}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            if [ "$state" = "up" ] && [ "$add_state" = "null" ] && [ "$busy" = "false" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::qBittorrent never finished adding without a VPN within 5 minutes"
          exit 1

      # The one proof reading source can't settle for a no-VPN install: a
      # real container on the `marrquee` network answering on the runner's
      # own published 8080, and Sonarr's own connection test moving its
      # existing qBittorrent client (still pointed at "gluetun" from an
      # earlier step) onto the new host by name, since matching on the
      # implementation alone would never notice the host changed.
      - name: Assert qBittorrent runs without a VPN and Sonarr's client points at it
        run: |
          running_without_vpn=$(curl -fsS http://127.0.0.1:7788/api/hub/status | jq -r '.running_without_vpn')
          if [ "$running_without_vpn" != "true" ]; then
            echo "::error::running_without_vpn was not true once qBittorrent finished adding without a VPN"
            exit 1
          fi

          network_mode=$(docker inspect -f '{{.HostConfig.NetworkMode}}' qbittorrent)
          echo "qbittorrent network mode: $network_mode"
          if [[ "$network_mode" == container:* ]]; then
            echo "::error::qBittorrent joined a companion's network instead of running on its own"
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          if [ "$code" != "200" ]; then
            echo "::error::qBittorrent's own published port 8080 did not answer (got ${code})"
            exit 1
          fi

          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi
          response=$(curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/downloadclient)
          if ! echo "$response" \
            | jq -e '[.[] | select(.implementation == "QBittorrent")][0].fields[] | select(.name == "host") | .value == "qbittorrent"' \
            > /dev/null
          then
            echo "::error::Sonarr's qBittorrent client host never moved to qbittorrent"
            exit 1
          fi

      # qBittorrent has to be gone before Gluetun can publish the same 8080
      # it was just holding, on a real daemon rather than just by reading
      # the compose builder's source. The fake login can never actually
      # connect - that failure is proven a few steps down - but the port
      # hand-over itself happens the moment the run starts, long before the
      # tunnel ever gets a chance to fail.
      - name: Add your VPN again hands qBittorrent's port to the tunnel (no-vpn hand-over)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/vpn \
            --data-urlencode "provider=protonvpn" \
            --data-urlencode "vpn_type=openvpn" \
            --data-urlencode "openvpn_user=marrquee-ci-not-a-user" \
            --data-urlencode "openvpn_password=${MARRQUEE_CI_VPN_PASSWORD}")
          if [ "$code" != "303" ]; then
            echo "::error::POST /hub/vpn returned ${code}, expected 303"
            exit 1
          fi

          started=false
          for _ in $(seq 1 10); do
            add_state=$(curl -fsS http://127.0.0.1:7788/api/hub/status \
              | jq -r '.apps[] | select(.app_id == "gluetun") | .add_state')
            if [ "$add_state" != "null" ] && [ -n "$add_state" ]; then
              started=true
              break
            fi
            sleep 2
          done
          if [ "$started" != "true" ]; then
            echo "::error::Add your VPN did not start"
            exit 1
          fi

          qbittorrent_gone=false
          gluetun_has_port=false
          for _ in $(seq 1 30); do
            if ! docker inspect qbittorrent > /dev/null 2>&1; then
              qbittorrent_gone=true
            fi
            port_bindings=$(docker inspect -f '{{json .HostConfig.PortBindings}}' gluetun 2>/dev/null || echo "")
            if echo "$port_bindings" | grep -q '"8080/tcp"'; then
              gluetun_has_port=true
            fi
            if [ "$qbittorrent_gone" = "true" ] && [ "$gluetun_has_port" = "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$qbittorrent_gone" != "true" ]; then
            echo "::error::qBittorrent was still running when the VPN started"
            exit 1
          fi
          if [ "$gluetun_has_port" != "true" ]; then
            echo "::error::The VPN did not get qBittorrent's port"
            exit 1
          fi

      # A fake login can never connect - it surfaces as either vpn_refused
      # or vpn_not_connected, never as up. This waits again here because
      # this run started from qBittorrent already installed and running
      # without a VPN, not merely absent, so it exercises a different path
      # through the same refusal.
      - name: Poll GET /api/hub/status until the no-vpn hand-over's VPN add reports its plain failure (4 minute budget)
        run: |
          add_state=""
          line=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            gluetun=$(echo "$status" | jq -c '.apps[] | select(.app_id == "gluetun")')
            state=$(echo "$gluetun" | jq -r '.state')
            add_state=$(echo "$gluetun" | jq -r '.add_state')
            line=$(echo "$gluetun" | jq -r '.line')
            echo "gluetun state: $state / add_state: $add_state"
            if [ "$state" = "up" ]; then
              echo "::error::A fake VPN login was reported as connected"
              exit 1
            fi
            if [ "$add_state" = "error" ]; then
              break
            fi
            sleep 2
          done
          if [ "$add_state" != "error" ]; then
            echo "::error::Gluetun's no-VPN add never reached add_state=error within 4 minutes"
            exit 1
          fi
          echo "NO_VPN_GLUETUN_LINE=$line" >> "$GITHUB_ENV"

      # The tile's `line` is `headline + " " + what_to_do` - split the two
      # candidate sentences the same way, inside the container, exactly
      # like the earlier VPN-failure check, so this compares against
      # exactly what the running code would say rather than a copy pasted
      # into the workflow.
      - name: Assert the no-vpn hand-over's VPN failure is one of the two plain sentences and qBittorrent stays paused
        run: |
          cat > "$RUNNER_TEMP/no_vpn_expected_lines.py" <<'PY'
          from marrquee.deploy import DeployManager, _split_failure_text
          from marrquee.vpn import find_provider
          from marrquee.words import failure_vpn_not_connected, failure_vpn_refused

          company = find_provider("protonvpn")
          assert company is not None
          minutes = round(DeployManager.TUNNEL_NEVER_UP_AFTER_SECONDS / 60)

          headline, what_to_do = _split_failure_text(failure_vpn_refused(company.label))
          print(f"{headline} {what_to_do}")

          headline, what_to_do = _split_failure_text(failure_vpn_not_connected(minutes))
          print(f"{headline} {what_to_do}")
          PY

          docker cp "$RUNNER_TEMP/no_vpn_expected_lines.py" marrquee-stack-smoke:/tmp/no_vpn_expected_lines.py
          expected=$(docker exec marrquee-stack-smoke python /tmp/no_vpn_expected_lines.py)
          echo "expected sentences:"
          echo "$expected"
          if ! echo "$expected" | grep -qxF "$NO_VPN_GLUETUN_LINE"; then
            echo "::error::the no-vpn hand-over's failed VPN tile line matched neither the vpn_refused nor the vpn_not_connected sentence"
            exit 1
          fi
          echo "::notice::the no-vpn hand-over's fake VPN login failed as expected: $NO_VPN_GLUETUN_LINE"

          paused=$(curl -fsS http://127.0.0.1:7788/api/hub/status \
            | jq -r '.apps[] | select(.app_id == "qbittorrent") | .paused')
          if [ "$paused" != "true" ]; then
            echo "::error::qBittorrent's tile was not paused while the no-vpn hand-over's VPN add was failing"
            exit 1
          fi

      # The owner's real way out of a VPN that will never connect: qBittorrent
      # comes back on its own network, the confirmation is kept (the owner
      # never has to type the phrase again), and the VPN's secrets are gone
      # for good.
      - name: Keep running without VPN brings qBittorrent back (no-vpn restore)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/apps/gluetun/cancel)
          if [ "$code" != "303" ]; then
            echo "::error::POST /hub/apps/gluetun/cancel returned ${code}, expected 303 (no-vpn restore)"
            exit 1
          fi

          restored=false
          for _ in $(seq 1 90); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status)
            qbit=$(echo "$status" | jq -c '.apps[] | select(.app_id == "qbittorrent")')
            state=$(echo "$qbit" | jq -r '.state')
            add_state=$(echo "$qbit" | jq -r '.add_state')
            busy=$(echo "$status" | jq -r '.busy')
            echo "qbittorrent state: $state / add_state: $add_state / busy: $busy"
            if [ "$state" = "up" ] && [ "$add_state" = "null" ] && [ "$busy" = "false" ]; then
              restored=true
              break
            fi
            sleep 2
          done
          if [ "$restored" != "true" ]; then
            echo "::error::qBittorrent never came back without a VPN within 3 minutes of Keep running without VPN"
            exit 1
          fi

          if docker inspect gluetun > /dev/null 2>&1; then
            echo "::error::gluetun's container still existed after Keep running without VPN"
            exit 1
          fi

          network_mode=$(docker inspect -f '{{.HostConfig.NetworkMode}}' qbittorrent)
          if [[ "$network_mode" == container:* ]]; then
            echo "::error::qBittorrent was still riding a companion's network after Keep running without VPN"
            exit 1
          fi

          running_without_vpn=$(curl -fsS http://127.0.0.1:7788/api/hub/status | jq -r '.running_without_vpn')
          if [ "$running_without_vpn" != "true" ]; then
            echo "::error::running_without_vpn was not true after Keep running without VPN restored qBittorrent"
            exit 1
          fi

          secrets_dir="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/vpn"
          remaining=$(docker exec marrquee-stack-smoke sh -c "ls -A '${secrets_dir}'")
          if [ -n "$remaining" ]; then
            echo "::error::the VPN secrets folder still had files after Keep running without VPN"
            exit 1
          fi

          if ! docker exec marrquee-stack-smoke test -e /config/without_vpn.json; then
            echo "::error::the without-VPN confirmation was lost by Keep running without VPN"
            exit 1
          fi

      # The one condition reading the source could never settle: Marrquee's
      # own view of the drive (`/host/<root>/...`) and the apps' own view
      # (`<root>/data` mounted at `/data`) must agree on whether a hard
      # link works, on a real bind mount. Sonarr proves its own half of
      # that agreement as the install's own PUID/PGID - the same user that
      # owns every file it imports - never as this job's root, so a
      # permission gap between the two users could never hide behind an
      # over-privileged proof. Radarr is running again by this point, but
      # only the tv pair (Sonarr's) is asserted from Sonarr's own side.
      - name: Marrquee's drive check agrees with Sonarr's own hard link
        run: |
          set -euo pipefail

          outcome=""
          for _ in $(seq 1 15); do
            outcome=$(docker exec marrquee-stack-smoke python3 -c "from marrquee.config import Settings; from marrquee.hardlinks import load_hardlink_result; r = load_hardlink_result(Settings.from_env().config_dir); print('' if r is None else f'{r.outcome}/{r.reason}')" 2>/dev/null) || outcome=""
            if [ -n "$outcome" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$outcome" ]; then
            echo "::error::Marrquee's drive check never saved a result"
            exit 1
          fi
          if [ "$outcome" != "works/None" ]; then
            echo "::error::Marrquee's drive check says ${outcome}"
            exit 1
          fi

          if ! ids=$(docker exec marrquee-stack-smoke python3 -c "import json; install = json.load(open('/config/install.json')); print(install['puid'], install['pgid'])") || [ -z "$ids" ]; then
            echo "::error::couldn't read PUID/PGID from /config/install.json"
            exit 1
          fi
          read -r puid pgid <<< "$ids"

          if ! docker exec sonarr sh -c 'command -v ln && command -v stat' > /dev/null; then
            echo "::error::Sonarr's container has neither ln nor stat to prove its own hard link with"
            exit 1
          fi

          if ! docker exec -u "$puid:$pgid" sonarr sh -c '
            set -e
            trap "rm -f /data/torrents/tv/.ci-link-proof /data/media/tv/.ci-link-proof" EXIT
            echo ci-link-proof > /data/torrents/tv/.ci-link-proof
            ln /data/torrents/tv/.ci-link-proof /data/media/tv/.ci-link-proof
            source_inode=$(stat -c %i /data/torrents/tv/.ci-link-proof)
            dest_inode=$(stat -c %i /data/media/tv/.ci-link-proof)
            [ "$source_inode" = "$dest_inode" ]
          '; then
            echo "::error::Sonarr could not hard-link inside /data, but Marrquee said it could"
            exit 1
          fi

          root="/host${RUNNER_TEMP}/marrquee-smoke/media/data"
          for kind in torrents media; do
            if ! docker exec marrquee-stack-smoke test -d "${root}/${kind}/tv"; then
              echo "::error::${root}/${kind}/tv did not exist - the leftover-file check below could not run"
              exit 1
            fi

            set +e
            docker exec marrquee-stack-smoke test -e "${root}/${kind}/tv/.marrquee-link-test"
            leftover=$?
            set -e
            case "$leftover" in
              0) echo "::error::the drive check left its test file behind in ${root}/${kind}/tv"; exit 1 ;;
              1) ;;
              *) echo "::error::couldn't check ${root}/${kind}/tv for a leftover test file (exit ${leftover})"; exit 1 ;;
            esac
          done

          page=$(curl -fsS http://127.0.0.1:7788/diagnostics)
          if ! docker exec -e DIAGNOSTICS_PAGE="$page" marrquee-stack-smoke python3 -c "import html, os; from marrquee.words import DRIVE_WORKS_TITLE; raise SystemExit(0 if DRIVE_WORKS_TITLE in html.unescape(os.environ['DIAGNOSTICS_PAGE']) else 1)"; then
            echo "::error::Diagnostics did not show DRIVE_WORKS_TITLE after the drive check passed"
            exit 1
          fi

      # A real Recyclarr container, added through the same Hub endpoint the
      # owner uses, actually creates the guide-backed profiles in Sonarr
      # and Radarr, and Marrquee's own log read agrees with what really
      # happened. None of this is provable by reading source alone - the
      # log's shape, the guide sync itself, a detached exec over the Docker
      # socket, and running as a user id with no passwd entry only settle
      # on a real daemon.
      - name: Recyclarr syncs quality from the TRaSH guides
        run: |
          set -euo pipefail

          # Radarr was left running by the drive check above - starting it
          # again here is a cheap, idempotent guard rather than a bet that
          # every earlier step in this job will always leave it that way.
          docker start radarr
          radarr_state=""
          for _ in $(seq 1 90); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              radarr_state=$(echo "$status" | jq -r '.apps[] | select(.app_id == "radarr") | .state')
              if [ "$radarr_state" = "up" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "$radarr_state" != "up" ]; then
            echo "::error::Radarr was not Up ahead of the Recyclarr sync proof"
            exit 1
          fi

          response=$(curl -s -w '\n%{http_code}' -X POST \
            http://127.0.0.1:7788/api/hub/apps/recyclarr/install \
            -H "Content-Type: application/json" \
            -d '{"answers":{"tv_quality":"1080p","movie_quality":"4k"}}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "hub install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/recyclarr/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

          add_state=""
          sync_state=""
          line=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              recyclarr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "recyclarr")')
              add_state=$(echo "$recyclarr" | jq -r '.add_state')
              sync_state=$(echo "$recyclarr" | jq -r '.sync_state')
              line=$(echo "$recyclarr" | jq -r '.line')
              echo "recyclarr add_state: $add_state / sync_state: $sync_state"
              if [ "$sync_state" = "failed" ]; then
                MESSAGE="Recyclarr's first sync failed: ${line}" \
                  python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
                exit 1
              fi
              if [ "$add_state" = "null" ] && [ "$sync_state" = "ok" ]; then
                break
              fi
            fi
            sleep 5
          done
          if [ "$add_state" != "null" ] || [ "$sync_state" != "ok" ]; then
            echo "::error::Recyclarr never finished adding and syncing within 10 minutes (add_state=${add_state}, sync_state=${sync_state})"
            exit 1
          fi

          log_dir="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/apps/recyclarr/logs/cli"
          if ! logs=$(docker exec marrquee-stack-smoke sh -c "ls '${log_dir}'") || [ -z "$logs" ]; then
            echo "::error::Recyclarr wrote no log where Marrquee reads it"
            exit 1
          fi
          if ! echo "$logs" | grep -qE '^recyclarr_.*\.debug\.log$'; then
            echo "::error::Recyclarr wrote no log where Marrquee reads it"
            exit 1
          fi

          if ! ids=$(docker exec marrquee-stack-smoke python3 -c "import json; install = json.load(open('/config/install.json')); print(install['puid'], install['pgid'])") || [ -z "$ids" ]; then
            echo "::error::couldn't read PUID/PGID from /config/install.json"
            exit 1
          fi
          read -r puid pgid <<< "$ids"

          # The guide-backed profiles really landing in a live Sonarr and
          # Radarr, read with the same keys Marrquee itself generated -
          # never trusted from Recyclarr's own log wording.
          cat > "$RUNNER_TEMP/recyclarr_profile_check.py" <<'PY'
          import asyncio
          import json
          from pathlib import Path

          import httpx


          async def main() -> None:
              install = json.loads(Path("/config/install.json").read_text())
              api_keys = install["api_keys"]

              async with httpx.AsyncClient(timeout=10.0) as client:
                  sonarr = await client.get(
                      "http://sonarr:8989/api/v3/qualityprofile",
                      headers={"X-Api-Key": api_keys["sonarr"]},
                  )
                  sonarr.raise_for_status()
                  sonarr_names = {profile["name"] for profile in sonarr.json()}
                  if "WEB-1080p" not in sonarr_names:
                      raise SystemExit(
                          f"Sonarr never got its WEB-1080p profile (has: {sorted(sonarr_names)})"
                      )

                  radarr = await client.get(
                      "http://radarr:7878/api/v3/qualityprofile",
                      headers={"X-Api-Key": api_keys["radarr"]},
                  )
                  radarr.raise_for_status()
                  radarr_names = {profile["name"] for profile in radarr.json()}
                  if "UHD Bluray + WEB" not in radarr_names:
                      raise SystemExit(
                          f"Radarr never got its UHD Bluray + WEB profile (has: {sorted(radarr_names)})"
                      )


          asyncio.run(main())
          PY

          docker cp "$RUNNER_TEMP/recyclarr_profile_check.py" marrquee-stack-smoke:/tmp/recyclarr_profile_check.py
          if ! output=$(docker exec marrquee-stack-smoke python3 /tmp/recyclarr_profile_check.py 2>&1); then
            echo "$output"
            MESSAGE="Recyclarr's guide-backed profiles never landed: ${output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$output"

          # WHICH USER runs this: Recyclarr's own image ignores PUID/PGID,
          # so this is the one live proof that `user:` really lands it on
          # the drive owner instead of the image's own default.
          if ! container_user=$(docker inspect -f '{{.Config.User}}' recyclarr) || [ -z "$container_user" ]; then
            echo "::error::couldn't read recyclarr's container user"
            exit 1
          fi
          if [ "$container_user" != "${puid}:${pgid}" ]; then
            echo "::error::recyclarr's container did not run as ${puid}:${pgid} (got: ${container_user})"
            exit 1
          fi

          if ! docker exec marrquee-stack-smoke sh -c 'command -v stat' > /dev/null; then
            echo "::error::stat is not available inside marrquee-stack-smoke to check recyclarr.yml's permissions"
            exit 1
          fi
          config_path="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/apps/recyclarr/recyclarr.yml"
          if ! config_perms=$(docker exec marrquee-stack-smoke stat -c '%a %u' "$config_path") || [ -z "$config_perms" ]; then
            echo "::error::couldn't stat recyclarr.yml at ${config_path}"
            exit 1
          fi
          if [ "$config_perms" != "600 ${puid}" ]; then
            echo "::error::recyclarr.yml was not 0600 owned by puid ${puid} (got: ${config_perms})"
            exit 1
          fi

          # No install API key ever leaks into compose.yaml's recyclarr
          # block - checked as root inside marrquee-stack-smoke, with a
          # tool-exists check first and a POSITIVE CONTROL (Sonarr's own
          # key IS found in Sonarr's own block) before the real check, so a
          # grep that could never find anything would fail loudly instead
          # of passing by accident.
          if ! docker exec marrquee-stack-smoke sh -c 'command -v grep' > /dev/null; then
            echo "::error::grep is not available inside marrquee-stack-smoke to check for a leaked API key"
            exit 1
          fi
          if ! keys=$(docker exec marrquee-stack-smoke python3 -c "import json; install = json.load(open('/config/install.json')); print(install['api_keys']['sonarr'], install['api_keys']['radarr'])") || [ -z "$keys" ]; then
            echo "::error::couldn't read Sonarr/Radarr API keys from install.json"
            exit 1
          fi
          read -r sonarr_key radarr_key <<< "$keys"

          compose_path="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/compose.yaml"
          if ! sonarr_block=$(docker exec marrquee-stack-smoke sed -n '/^  sonarr:/,/^$/p' "$compose_path") || [ -z "$sonarr_block" ]; then
            echo "::error::couldn't read Sonarr's own service block out of compose.yaml"
            exit 1
          fi
          if ! echo "$sonarr_block" | grep -qF "$sonarr_key"; then
            echo "::error::the positive control failed - Sonarr's own key was not found in its own compose.yaml block, so the check below would prove nothing"
            exit 1
          fi

          if ! recyclarr_block=$(docker exec marrquee-stack-smoke sed -n '/^  recyclarr:/,/^$/p' "$compose_path") || [ -z "$recyclarr_block" ]; then
            echo "::error::couldn't read Recyclarr's own service block out of compose.yaml"
            exit 1
          fi
          for key in "$sonarr_key" "$radarr_key"; do
            set +e
            echo "$recyclarr_block" | grep -qF "$key"
            leaked=$?
            set -e
            case "$leaked" in
              1) ;;
              0) echo "::error::an install API key leaked into the recyclarr service block of compose.yaml"; exit 1 ;;
              *) echo "::error::couldn't check the recyclarr service block for a leaked API key (grep exit ${leaked})"; exit 1 ;;
            esac
          done

      # The amber half: a sync that cannot reach a stopped Radarr turns the
      # poster amber with the exact plain reason `recyclarr_line_app_down`
      # gives, never anything Recyclarr's own log says in English. Step
      # 1's `sync_state == "ok"` doubles as this step's positive control:
      # it already proved the same poll loop and the same JSON field can
      # read a genuine success, so a poll that could never settle either
      # way would already have failed step 1, not silently passed here.
      - name: A failed Recyclarr sync turns amber with a reason
        run: |
          set -euo pipefail

          docker stop radarr

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/apps/recyclarr/sync)
          if [ "$code" != "303" ]; then
            echo "::error::POST /hub/apps/recyclarr/sync returned ${code}, expected 303"
            exit 1
          fi

          sync_state=""
          line=""
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              recyclarr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "recyclarr")')
              sync_state=$(echo "$recyclarr" | jq -r '.sync_state')
              line=$(echo "$recyclarr" | jq -r '.line')
              echo "recyclarr sync_state: $sync_state"
              if [ "$sync_state" = "failed" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "$sync_state" != "failed" ]; then
            echo "::error::A failed sync was not reported (state ${sync_state})"
            exit 1
          fi

          # The reason line is plain JSON text, never Jinja-escaped - but
          # the comparison itself runs inside the container against the
          # exact same word function the poster calls, unescaping rather
          # than re-encoding so a real apostrophe still equals a real
          # apostrophe either way.
          cat > "$RUNNER_TEMP/recyclarr_line_check.py" <<'PY'
          import html
          import os

          from marrquee.words import recyclarr_line_app_down

          expected = recyclarr_line_app_down("Radarr")
          actual = html.unescape(os.environ["ACTUAL_LINE"])
          raise SystemExit(0 if actual == expected else 1)
          PY
          docker cp "$RUNNER_TEMP/recyclarr_line_check.py" marrquee-stack-smoke:/tmp/recyclarr_line_check.py
          if ! docker exec -e ACTUAL_LINE="$line" marrquee-stack-smoke python3 /tmp/recyclarr_line_check.py; then
            echo "::error::the failed sync's reason did not match recyclarr_line_app_down('Radarr'): ${line}"
            exit 1
          fi

          docker start radarr
          radarr_state=""
          for _ in $(seq 1 60); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              radarr_state=$(echo "$status" | jq -r '.apps[] | select(.app_id == "radarr") | .state')
              if [ "$radarr_state" = "up" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "$radarr_state" != "up" ]; then
            echo "::error::Radarr never came back Up after being restarted to close out the amber-sync proof"
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/apps/recyclarr/sync)
          if [ "$code" != "303" ]; then
            echo "::error::the restore Sync now returned ${code}, expected 303"
            exit 1
          fi

          sync_state=""
          for _ in $(seq 1 150); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              sync_state=$(echo "$status" | jq -r '.apps[] | select(.app_id == "recyclarr") | .sync_state')
              if [ "$sync_state" = "ok" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "$sync_state" != "ok" ]; then
            echo "::error::Recyclarr never recovered to sync_state=ok after Radarr came back and Sync now was pressed again"
            exit 1
          fi

      # Plex is added to the in-memory compose plan only - install.json and
      # the real compose.yaml on disk are never touched, so this fake claim
      # code can never become part of the real install a later run
      # continues from. Mirrors `DeployManager._stack_plan`'s own
      # `without_vpn=without_vpn_confirmed(...)` call, because qBittorrent
      # is already running without Gluetun at this point in the job and
      # `build_stack_plan` would otherwise refuse the whole plan.
      - name: Plex runs on the host network and Marrquee reaches it
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ci_plex_bring_up.py" <<'PY'
          import asyncio
          import os
          from pathlib import Path, PurePosixPath

          from marrquee.compose import build_stack_plan, render_compose
          from marrquee.config import Settings
          from marrquee.docker_client import SocketDockerEngine
          from marrquee.install import with_app_added
          from marrquee.plex import write_plex_claim
          from marrquee.questions import load_answers
          from marrquee.state import load_state
          from marrquee.without_vpn import without_vpn_confirmed


          async def main() -> None:
              settings = Settings.from_env()
              state = load_state(settings.config_dir)
              if state is None:
                  raise SystemExit("no install.json to grow")
              answers = load_answers(settings.config_dir)

              grown = with_app_added(state, "plex")
              root = PurePosixPath(state.storage_root)
              write_plex_claim(settings, root, "claim-marrquee-ci-not-real")

              plan = build_stack_plan(
                  grown, answers, without_vpn=without_vpn_confirmed(settings.config_dir)
              )
              compose_path = Path(
                  f"/host{os.environ['RUNNER_TEMP']}/marrquee-smoke/ci-plex-compose.yaml"
              )
              compose_path.write_text(render_compose(plan))

              engine = SocketDockerEngine(
                  settings.docker_socket, compose_binary=settings.compose_binary
              )
              result = await engine.compose_up("marrquee-apps", compose_path, "plex")
              if not result.ok:
                  raise SystemExit(f"compose up for plex failed: {result.output}")
              print("plex compose up: ok")


          asyncio.run(main())
          PY

          docker cp "$RUNNER_TEMP/ci_plex_bring_up.py" marrquee-stack-smoke:/tmp/ci_plex_bring_up.py

          pull_start=$(date +%s)
          if ! bring_up_output=$(docker exec -e RUNNER_TEMP="$RUNNER_TEMP" marrquee-stack-smoke python3 /tmp/ci_plex_bring_up.py 2>&1) || [ -z "$bring_up_output" ]; then
            echo "$bring_up_output"
            echo "::error::Plex's in-memory compose bring-up failed"
            exit 1
          fi
          echo "$bring_up_output"
          pull_elapsed=$(( $(date +%s) - pull_start ))
          echo "::notice::Plex's image pull and compose up took ${pull_elapsed}s"

          if ! network_mode=$(docker inspect -f '{{.HostConfig.NetworkMode}}' plex) || [ -z "$network_mode" ]; then
            echo "::error::couldn't inspect the plex container's network mode"
            exit 1
          fi
          echo "plex network mode: $network_mode"
          if [ "$network_mode" != "host" ]; then
            echo "::error::Plex is not on the host network"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_plex_address.py" <<'PY'
          import asyncio

          from marrquee.config import Settings
          from marrquee.docker_client import SocketDockerEngine
          from marrquee.plex import plex_host_address


          async def main() -> None:
              settings = Settings.from_env()
              engine = SocketDockerEngine(
                  settings.docker_socket, compose_binary=settings.compose_binary
              )
              self_id = await engine.self_container_id()
              address = await plex_host_address(engine, self_id)
              if address is None:
                  raise SystemExit("Marrquee could not work out its own reachable address")
              print(address)


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_plex_address.py" marrquee-stack-smoke:/tmp/ci_plex_address.py

          if ! address=$(docker exec marrquee-stack-smoke python3 /tmp/ci_plex_address.py) || [ -z "$address" ]; then
            echo "::error::Marrquee could not work out its own reachable address for Plex"
            exit 1
          fi
          echo "plex address: $address"

          cat > "$RUNNER_TEMP/ci_plex_identity.py" <<'PY'
          import asyncio
          import os

          from marrquee.plex import HttpPlexServer, plex_base_url


          async def main() -> None:
              address = os.environ["PLEX_ADDRESS"]
              server = HttpPlexServer()
              identity = await server.identity(plex_base_url(address))
              if identity is None:
                  print("none")
                  return
              print("claimed" if identity.claimed else "unclaimed")


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_plex_identity.py" marrquee-stack-smoke:/tmp/ci_plex_identity.py

          identity_state=""
          for _ in $(seq 1 60); do
            identity_state=$(docker exec -e PLEX_ADDRESS="$address" marrquee-stack-smoke python3 /tmp/ci_plex_identity.py) || identity_state=""
            echo "plex identity: $identity_state"
            if [ -n "$identity_state" ] && [ "$identity_state" != "none" ]; then
              break
            fi
            sleep 5
          done
          if [ "$identity_state" = "none" ] || [ -z "$identity_state" ]; then
            echo "::error::Marrquee couldn't reach Plex through the host address ${address}"
            exit 1
          fi
          if [ "$identity_state" != "unclaimed" ]; then
            echo "::error::A fake claim code was reported as linked"
            exit 1
          fi

          if ! docker exec marrquee-stack-smoke sh -c 'command -v grep' > /dev/null; then
            echo "::error::grep is not available inside marrquee-stack-smoke to check Plex's own logs"
            exit 1
          fi
          plex_logs=$(docker logs plex 2>&1 || true)
          for phrase in "PLEX_CLAIM set from FILE__PLEX_CLAIM" "Unable to claim Plex server"; do
            set +e
            echo "$plex_logs" | grep -qF "$phrase"
            found=$?
            set -e
            case "$found" in
              0) ;;
              1) echo "::error::Plex's own log never said: ${phrase}"; exit 1 ;;
              *) echo "::error::couldn't check Plex's own logs for its claim code (grep exit ${found})"; exit 1 ;;
            esac
          done

          # The web UI can lag `/identity` by a few seconds, so this polls
          # rather than asserting a single request - and a connection
          # refused (curl's own non-zero exit) must never abort the step
          # silently under `set -euo pipefail`.
          web_code=""
          for _ in $(seq 1 12); do
            web_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:32400/web/index.html) || web_code=""
            echo "plex /web/index.html: $web_code"
            if [ "$web_code" = "200" ]; then
              break
            fi
            sleep 5
          done
          if [ "$web_code" != "200" ]; then
            echo "::error::Plex's /web/index.html did not answer 200 (got ${web_code})"
            exit 1
          fi

      # WHICH USER runs this: linuxserver's own init reads the claim code as
      # root, and only Marrquee is ever meant to see it - checked as root
      # inside marrquee-stack-smoke, with a tool-exists check first and a
      # POSITIVE CONTROL (the fake code IS found inside its own secrets
      # file) before the real negative check, so a grep that could never
      # find anything would fail loudly instead of passing by accident. The
      # real compose.yaml on disk never carries Plex at all (it was only
      # ever added in memory above), so this also stands as proof that
      # in-memory experiment never leaked into it.
      - name: Plex's one-time link code stays root-only
        run: |
          set -euo pipefail

          secrets_dir="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/plex"
          claim_path="${secrets_dir}/plex_claim"
          compose_path="/host${RUNNER_TEMP}/marrquee-smoke/media/marrquee/compose.yaml"

          if ! docker exec marrquee-stack-smoke sh -c 'command -v stat' > /dev/null; then
            echo "::error::stat is not available inside marrquee-stack-smoke to check Plex's secrets folder"
            exit 1
          fi
          if ! dir_perms=$(docker exec marrquee-stack-smoke stat -c '%a %u' "$secrets_dir") || [ -z "$dir_perms" ]; then
            echo "::error::couldn't stat Plex's secrets folder at ${secrets_dir}"
            exit 1
          fi
          if [ "$dir_perms" != "700 0" ]; then
            echo "::error::Plex's secrets folder was not 0700 owned by root (got: ${dir_perms})"
            exit 1
          fi
          if ! file_perms=$(docker exec marrquee-stack-smoke stat -c '%a %u' "$claim_path") || [ -z "$file_perms" ]; then
            echo "::error::couldn't stat Plex's claim file at ${claim_path}"
            exit 1
          fi
          if [ "$file_perms" != "600 0" ]; then
            echo "::error::Plex's claim file was not 0600 owned by root (got: ${file_perms})"
            exit 1
          fi

          if ! docker exec marrquee-stack-smoke sh -c 'command -v grep' > /dev/null; then
            echo "::error::grep is not available inside marrquee-stack-smoke to check for a leaked Plex claim code"
            exit 1
          fi
          if ! docker exec marrquee-stack-smoke grep -qF "claim-marrquee-ci-not-real" "$claim_path"; then
            echo "::error::the positive control failed - the fake claim code was not found in its own secrets file, so the check below would prove nothing"
            exit 1
          fi

          set +e
          docker exec marrquee-stack-smoke grep -qF "claim-marrquee-ci-not-real" "$compose_path"
          leaked=$?
          set -e
          case "$leaked" in
            1) ;;
            0) echo "::error::the fake Plex claim code leaked into the real compose.yaml"; exit 1 ;;
            *) echo "::error::couldn't check compose.yaml for a leaked Plex claim code (grep exit ${leaked})"; exit 1 ;;
          esac

          cat > "$RUNNER_TEMP/ci_plex_clear_claim.py" <<'PY'
          from pathlib import PurePosixPath

          from marrquee.config import Settings
          from marrquee.plex import clear_plex_claim
          from marrquee.state import load_state

          settings = Settings.from_env()
          state = load_state(settings.config_dir)
          if state is None:
              raise SystemExit("no install.json to read the storage root from")
          clear_plex_claim(settings, PurePosixPath(state.storage_root))
          PY
          docker cp "$RUNNER_TEMP/ci_plex_clear_claim.py" marrquee-stack-smoke:/tmp/ci_plex_clear_claim.py
          if ! docker exec marrquee-stack-smoke python3 /tmp/ci_plex_clear_claim.py; then
            echo "::error::clear_plex_claim failed to run"
            exit 1
          fi

          if ! remaining=$(docker exec marrquee-stack-smoke sh -c "ls -A '${secrets_dir}'"); then
            echo "::error::couldn't list Plex's secrets folder after clearing the claim"
            exit 1
          fi
          if [ -n "$remaining" ]; then
            echo "::error::Plex's secrets folder was not empty after clear_plex_claim (${remaining})"
            exit 1
          fi

      # Plex was only ever grown into the compose plan in memory above - its
      # container is still really running on the host, and the product's
      # one-of rule means Plex and Jellyfin never run together for real, so
      # it goes before Jellyfin's own proof begins.
      - name: The graphics chip check asks the real Docker and leaves nothing behind
        run: |
          set -euo pipefail

          docker rm -f plex > /dev/null 2>&1 || true
          plex_leftover=$(docker ps -aq --filter name=^plex$) || plex_leftover=""
          if [ -n "$plex_leftover" ]; then
            echo "::error::Plex's container was still present after docker rm -f plex"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_graphics_probe.py" <<'PY'
          import asyncio

          from marrquee.config import Settings
          from marrquee.docker_client import SocketDockerEngine


          async def main() -> None:
              settings = Settings.from_env()
              engine = SocketDockerEngine(
                  settings.docker_socket, compose_binary=settings.compose_binary
              )
              self_id = await engine.self_container_id()
              if self_id is None:
                  raise SystemExit("Marrquee could not find its own container id")

              absent = await engine.probe_host_path(self_id, "/marrquee-ci-no-such-device")
              present = await engine.probe_host_path(self_id, "/dev/null")
              print(f"absent={absent.result}")
              print(f"present={present.result}")


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_graphics_probe.py" marrquee-stack-smoke:/tmp/ci_graphics_probe.py

          if ! probe_output=$(docker exec marrquee-stack-smoke python3 /tmp/ci_graphics_probe.py); then
            echo "::error::The graphics chip probe script failed to run"
            exit 1
          fi
          echo "$probe_output"
          absent_result=$(echo "$probe_output" | sed -n 's/^absent=//p')
          present_result=$(echo "$probe_output" | sed -n 's/^present=//p')

          case "$absent_result" in
            absent) ;;
            *) echo "::error::The graphics chip check read ${absent_result} for /marrquee-ci-no-such-device"; exit 1 ;;
          esac
          case "$present_result" in
            present) ;;
            *) echo "::error::The graphics chip check read ${present_result} for /dev/null"; exit 1 ;;
          esac

          leftover=$(docker ps -aq --filter name=marrquee-graphics-check) || leftover=""
          if [ -n "$leftover" ]; then
            echo "::error::The graphics chip check left a container behind"
            exit 1
          fi

          if ! test ! -e /marrquee-ci-no-such-device; then
            echo "::error::The graphics chip check created the path it was only ever meant to probe"
            exit 1
          fi

          if [ -e /dev/dri/renderD128 ]; then
            echo "the runner already has a graphics chip node"
          else
            sudo mkdir -p /dev/dri
            sudo mknod -m 0666 /dev/dri/renderD128 c 226 128
            touch "$RUNNER_TEMP/marrquee-made-dri"
          fi

          # Restarting (never recreating) clears GraphicsChipCheck's
          # in-memory cache, which every earlier Hub load in this job already
          # settled on "absent" - a fresh process is the only way it asks
          # Docker again now that the node exists.
          docker restart marrquee-stack-smoke

          healthz_ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz > /dev/null 2>&1; then
              healthz_ready=true
              break
            fi
            sleep 2
          done
          if [ "$healthz_ready" != "true" ]; then
            echo "::error::Marrquee never answered /healthz within 60s after restarting for the graphics chip"
            exit 1
          fi

      # The whole point of this job's Jellyfin proof: the Hub's own install
      # endpoint, on real Jellyfin 12.1, with the graphics chip question
      # actually answered "yes" - never a script that pokes Jellyfin's API
      # directly, since that would prove nothing about Marrquee's own setup.
      - name: Jellyfin is set up with the one login, its libraries and the graphics chip
        run: |
          set -euo pipefail

          install_html=$(curl -fsS "http://127.0.0.1:7788/?panel=install") || install_html=""
          if ! echo "$install_html" | grep -qF 'data-question-step="jellyfin:graphics"'; then
            echo "::error::The graphics question wasn't offered although /dev/dri/renderD128 exists"
            exit 1
          fi

          pull_start=$(date +%s)
          if ! response=$(curl -s -w '\n%{http_code}' -X POST http://127.0.0.1:7788/api/hub/apps/jellyfin/install -H "Content-Type: application/json" -d '{"answers":{"graphics_chip":"yes"}}'); then
            echo "::error::couldn't reach Marrquee to install Jellyfin"
            exit 1
          fi
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "hub install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/jellyfin/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

          state=""
          add_state=""
          note=""
          busy=""
          line=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              jellyfin=$(echo "$status" | jq -c '.apps[] | select(.app_id == "jellyfin")')
              state=$(echo "$jellyfin" | jq -r '.state')
              add_state=$(echo "$jellyfin" | jq -r '.add_state')
              note=$(echo "$jellyfin" | jq -r '.note')
              busy=$(echo "$status" | jq -r '.busy')
              line=$(echo "$jellyfin" | jq -r '.line')
              echo "jellyfin state: $state / add_state: $add_state / note: $note / busy: $busy"
              if [ "$add_state" = "error" ]; then
                MESSAGE="adding Jellyfin failed: ${line}" \
                  python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
                exit 1
              fi
              if [ "$state" = "up" ] && [ "$add_state" = "null" ] && [ -z "$note" ] && [ "$busy" = "false" ]; then
                break
              fi
            fi
            sleep 5
          done
          if [ "$state" != "up" ] || [ "$add_state" != "null" ] || [ -n "$note" ] || [ "$busy" != "false" ]; then
            echo "::error::Jellyfin never finished adding within 10 minutes (state=${state}, add_state=${add_state}, note=${note}, busy=${busy})"
            exit 1
          fi
          pull_elapsed=$(( $(date +%s) - pull_start ))
          echo "::notice::Jellyfin's image pull and first-time setup took ${pull_elapsed}s"

          if ! network_mode=$(docker inspect -f '{{.HostConfig.NetworkMode}}' jellyfin) || [ -z "$network_mode" ]; then
            echo "::error::couldn't inspect the jellyfin container's network mode"
            exit 1
          fi
          if [ "$network_mode" != "host" ]; then
            echo "::error::Jellyfin is not on the host network"
            exit 1
          fi

          if ! device_path=$(docker inspect -f '{{range .HostConfig.Devices}}{{.PathOnHost}}{{end}}' jellyfin) || [ -z "$device_path" ]; then
            echo "::error::couldn't inspect Jellyfin's device mappings"
            exit 1
          fi
          if [ "$device_path" != "/dev/dri" ]; then
            echo "::error::Jellyfin's graphics chip device was not passed through as /dev/dri (got: ${device_path})"
            exit 1
          fi
          if ! docker exec jellyfin test -c /dev/dri/renderD128; then
            echo "::error::/dev/dri/renderD128 is not a character device inside the jellyfin container"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_jellyfin_checks.py" <<'PY'
          import asyncio

          from marrquee.config import Settings
          from marrquee.docker_client import SocketDockerEngine
          from marrquee.graphics_chip import GRAPHICS_DEVICE_NODE
          from marrquee.jellyfin import (
              HttpJellyfinServer,
              jellyfin_base_url,
              load_jellyfin,
              parse_virtual_folders,
          )
          from marrquee.login import load_login
          from marrquee.plex import plex_host_address
          from marrquee.storage import container_media_path


          async def main() -> None:
              settings = Settings.from_env()
              engine = SocketDockerEngine(
                  settings.docker_socket, compose_binary=settings.compose_binary
              )
              self_id = await engine.self_container_id()
              address = await plex_host_address(engine, self_id)
              if address is None:
                  raise SystemExit("Marrquee could not work out its own reachable address for Jellyfin")
              base_url = jellyfin_base_url(address)
              server = HttpJellyfinServer()

              public_info = await server.request("GET", base_url, "/System/Info/Public", token=None)
              if not public_info.ok or not isinstance(public_info.payload, dict):
                  raise SystemExit(f"Jellyfin's public system info was unreachable (status {public_info.status})")
              if public_info.payload.get("StartupWizardCompleted") is not True:
                  raise SystemExit("Jellyfin's own setup wizard was never marked complete")
              if public_info.payload.get("ServerName") != "Marrquee":
                  raise SystemExit(
                      f"Jellyfin's server name is not Marrquee (got {public_info.payload.get('ServerName')!r})"
                  )
              print(f"jellyfin version: {public_info.payload.get('Version')}")

              login_record = load_login(settings.config_dir)
              if login_record.login is None:
                  raise SystemExit("no login is saved to sign in to Jellyfin with")
              auth = await server.request(
                  "POST",
                  base_url,
                  "/Users/AuthenticateByName",
                  token=None,
                  json_body={
                      "Username": login_record.login.username,
                      "Pw": login_record.login.password,
                  },
              )
              if not auth.ok or not isinstance(auth.payload, dict):
                  raise SystemExit(f"signing in to Jellyfin as the one login failed (status {auth.status})")
              session_token = auth.payload.get("AccessToken")
              if not isinstance(session_token, str) or not session_token:
                  raise SystemExit("Jellyfin's sign-in response carried no AccessToken")
              await server.request("POST", base_url, "/Sessions/Logout", token=session_token)

              record = load_jellyfin(settings.config_dir)
              if record is None:
                  raise SystemExit("no jellyfin.json was saved")

              libraries_response = await server.request(
                  "GET", base_url, "/Library/VirtualFolders", token=record.api_key
              )
              if not libraries_response.ok:
                  raise SystemExit(f"could not read Jellyfin's libraries (status {libraries_response.status})")
              units = {
                  (library.collection_type, library.locations)
                  for library in parse_virtual_folders(libraries_response.payload)
              }
              movies_path = str(container_media_path("movies"))
              tv_path = str(container_media_path("tv"))
              if ("movies", (movies_path,)) not in units:
                  raise SystemExit("Jellyfin's Movies library was never created at the right path")
              if ("tvshows", (tv_path,)) not in units:
                  raise SystemExit("Jellyfin's TV Shows library was never created at the right path")

              encoding = await server.request(
                  "GET", base_url, "/System/Configuration/encoding", token=record.api_key
              )
              if not encoding.ok or not isinstance(encoding.payload, dict):
                  raise SystemExit(f"could not read Jellyfin's encoding configuration (status {encoding.status})")
              accel = encoding.payload.get("HardwareAccelerationType")
              if accel not in ("vaapi", 5):
                  raise SystemExit(f"Jellyfin's hardware acceleration is not vaapi (got {accel!r})")
              if encoding.payload.get("VaapiDevice") != GRAPHICS_DEVICE_NODE:
                  raise SystemExit("Jellyfin's VaapiDevice does not point at the graphics chip node")

              print("jellyfin setup check: ok")


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_jellyfin_checks.py" marrquee-stack-smoke:/tmp/ci_jellyfin_checks.py
          if ! checks_output=$(docker exec marrquee-stack-smoke python3 /tmp/ci_jellyfin_checks.py 2>&1); then
            echo "$checks_output"
            MESSAGE="Jellyfin's own setup check failed: ${checks_output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:800].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$checks_output"

          web_code=$(curl -s -o /dev/null -w '%{http_code}' -L http://127.0.0.1:8096/) || web_code=""
          if [ "$web_code" != "200" ]; then
            echo "::error::Jellyfin's own sign-in page did not answer 200 (got ${web_code})"
            exit 1
          fi

          if ! docker exec marrquee-stack-smoke sh -c 'command -v stat' > /dev/null; then
            echo "::error::stat is not available inside marrquee-stack-smoke to check jellyfin.json's permissions"
            exit 1
          fi
          if ! jellyfin_json_perms=$(docker exec marrquee-stack-smoke stat -c '%a %u' /config/jellyfin.json) || [ -z "$jellyfin_json_perms" ]; then
            echo "::error::couldn't stat /config/jellyfin.json"
            exit 1
          fi
          if [ "$jellyfin_json_perms" != "600 0" ]; then
            echo "::error::jellyfin.json was not 0600 owned by root (got: ${jellyfin_json_perms})"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_jellyfin_key_check.py" <<'PY'
          import json
          import os
          from pathlib import Path

          jellyfin_json = Path("/config/jellyfin.json")
          compose_yaml = Path(f"/host{os.environ['RUNNER_TEMP']}/marrquee-smoke/media/marrquee/compose.yaml")

          raw_jellyfin_json = jellyfin_json.read_text()
          record = json.loads(raw_jellyfin_json)
          key = record["api_key"]

          if key not in raw_jellyfin_json:
              raise SystemExit("the positive control failed: the saved key is not even in its own raw file")

          compose_text = compose_yaml.read_text()
          print("verdict=leak" if key in compose_text else "verdict=clean")
          print(f"key_length={len(key)}")
          PY
          docker cp "$RUNNER_TEMP/ci_jellyfin_key_check.py" marrquee-stack-smoke:/tmp/ci_jellyfin_key_check.py

          if ! key_check_output=$(docker exec -e RUNNER_TEMP="$RUNNER_TEMP" marrquee-stack-smoke python3 /tmp/ci_jellyfin_key_check.py); then
            echo "::error::the Jellyfin key check's positive control failed - the check below would prove nothing"
            exit 1
          fi
          echo "$key_check_output"
          verdict=$(echo "$key_check_output" | sed -n 's/^verdict=//p')

          case "$verdict" in
            clean) ;;
            leak) echo "::error::the Jellyfin API key leaked into compose.yaml"; exit 1 ;;
            *) echo "::error::the Jellyfin key check produced an unexpected verdict (${verdict})"; exit 1 ;;
          esac

      # The API key Marrquee minted stays valid through the rename - only
      # the admin's name and password on Jellyfin itself change, so this
      # never restarts Jellyfin, the same as every other login-change
      # branch. This is the last step in the job to need the login at
      # all, so there is no "change back": nothing later reads the
      # original username or password again.
      - name: Changing the one login changes Jellyfin's admin
        run: |
          set -euo pipefail

          if ! new_password=$(openssl rand -hex 16); then
            echo "::error::couldn't generate a second throwaway password"
            exit 1
          fi
          echo "::add-mask::$new_password"

          if ! change_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/hub/login/change --data-urlencode "current_password=${MARRQUEE_CI_PASSWORD}" --data-urlencode "username=marrquee-ci-two" --data-urlencode "password=${new_password}" --data-urlencode "password_again=${new_password}"); then
            echo "::error::couldn't reach Marrquee to change the login"
            exit 1
          fi
          if [ "$change_code" != "303" ]; then
            echo "::error::POST /hub/login/change returned ${change_code:-<no response>}, expected 303"
            exit 1
          fi

          busy=""
          banner=""
          for _ in $(seq 1 90); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              busy=$(echo "$status" | jq -r '.busy')
              banner=$(echo "$status" | jq -r '.login_banner')
              echo "login change: busy=$busy login_banner=$banner"
              if [ "$busy" = "false" ] && [ "$banner" = "none" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "$busy" != "false" ] || [ "$banner" != "none" ]; then
            echo "::error::the login change never finished within 3 minutes (busy=${busy}, login_banner=${banner})"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_jellyfin_login_change.py" <<'PY'
          import asyncio
          import os

          from marrquee.config import Settings
          from marrquee.docker_client import SocketDockerEngine
          from marrquee.jellyfin import HttpJellyfinServer, jellyfin_base_url
          from marrquee.plex import plex_host_address


          async def main() -> None:
              settings = Settings.from_env()
              engine = SocketDockerEngine(
                  settings.docker_socket, compose_binary=settings.compose_binary
              )
              self_id = await engine.self_container_id()
              address = await plex_host_address(engine, self_id)
              if address is None:
                  raise SystemExit("Marrquee could not work out its own reachable address for Jellyfin")
              base_url = jellyfin_base_url(address)
              server = HttpJellyfinServer()

              new_password = os.environ["JELLYFIN_NEW_PASSWORD"]
              old_password = os.environ["JELLYFIN_OLD_PASSWORD"]

              new_auth = await server.request(
                  "POST",
                  base_url,
                  "/Users/AuthenticateByName",
                  token=None,
                  json_body={"Username": "marrquee-ci-two", "Pw": new_password},
              )
              if not new_auth.ok:
                  raise SystemExit(f"signing in with the new login failed (status {new_auth.status})")

              old_auth = await server.request(
                  "POST",
                  base_url,
                  "/Users/AuthenticateByName",
                  token=None,
                  json_body={"Username": "marrquee-ci", "Pw": old_password},
              )
              if old_auth.status != 401:
                  raise SystemExit(f"the old login still works (status {old_auth.status}, expected 401)")

              print("jellyfin login change check: ok")


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_jellyfin_login_change.py" marrquee-stack-smoke:/tmp/ci_jellyfin_login_change.py
          if ! login_change_output=$(docker exec -e JELLYFIN_NEW_PASSWORD="$new_password" -e JELLYFIN_OLD_PASSWORD="$MARRQUEE_CI_PASSWORD" marrquee-stack-smoke python3 /tmp/ci_jellyfin_login_change.py 2>&1); then
            echo "$login_change_output"
            echo "::error::Jellyfin's admin was not changed by the one login's password change"
            exit 1
          fi
          echo "$login_change_output"

      # existing-plex is `managed=False`: connecting one never deploys a
      # container, so this step proves the refusals alone - Jellyfin
      # already occupies the one media-server slot, so every door here
      # (the install row, the JSON endpoint, the sign-in round trip, and a
      # connect posted straight at a made-up id) must say no, write
      # nothing, and leave compose.yaml and the app list untouched.
      - name: Connecting your own Plex is refused while Jellyfin is installed
        run: |
          set -euo pipefail

          if ! install_html=$(curl -fsS "http://127.0.0.1:7788/?panel=install") || [ -z "$install_html" ]; then
            echo "::error::couldn't fetch the install pane to check existing-plex's own row"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ci_existing_plex_refused.py" <<'PY'
          import html
          import os
          import re

          from marrquee.words import PLEX_EXCLUDES_JELLYFIN, hub_install_unavailable

          page = html.unescape(os.environ["INSTALL_HTML"])
          match = re.search(r'data-install-row="existing-plex".*?</li>', page, re.DOTALL)
          if match is None:
              raise SystemExit("existing-plex's own install row is missing from the install pane")
          row = match.group(0)
          if 'data-available="false"' not in row:
              raise SystemExit("existing-plex's install row was not marked unavailable")
          if hub_install_unavailable(PLEX_EXCLUDES_JELLYFIN) not in row:
              raise SystemExit("existing-plex's own exclusion reason is missing from its row")
          print("existing-plex refusal check: ok")
          PY
          docker cp "$RUNNER_TEMP/ci_existing_plex_refused.py" marrquee-stack-smoke:/tmp/ci_existing_plex_refused.py
          if ! refusal_output=$(docker exec -e INSTALL_HTML="$install_html" marrquee-stack-smoke python3 /tmp/ci_existing_plex_refused.py 2>&1); then
            echo "$refusal_output"
            echo "::error::existing-plex's own install row did not read as refused"
            exit 1
          fi
          echo "$refusal_output"

          if ! json_response=$(curl -s -w '\n%{http_code}' -X POST http://127.0.0.1:7788/api/hub/apps/existing-plex/install -H 'Content-Type: application/json' -d '{"answers":{}}') || [ -z "$json_response" ]; then
            echo "::error::couldn't POST the JSON install endpoint for existing-plex"
            exit 1
          fi
          json_code=$(echo "$json_response" | tail -n1)
          if [ "$json_code" != "409" ]; then
            echo "::error::POST /api/hub/apps/existing-plex/install returned ${json_code}, expected 409"
            exit 1
          fi

          if ! sign_in_response=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -X POST http://127.0.0.1:7788/plex/sign-in --data-urlencode "then=connect") || [ -z "$sign_in_response" ]; then
            echo "::error::couldn't POST /plex/sign-in with then=connect"
            exit 1
          fi
          if [ "$sign_in_response" != "303 http://127.0.0.1:7788/" ]; then
            echo "::error::POST /plex/sign-in (then=connect) returned ${sign_in_response}, expected 303 http://127.0.0.1:7788/"
            exit 1
          fi

          if ! connect_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7788/plex/connect --data-urlencode "machine_id=ci-none") || [ -z "$connect_code" ]; then
            echo "::error::couldn't POST /plex/connect"
            exit 1
          fi
          if [ "$connect_code" != "303" ]; then
            echo "::error::POST /plex/connect returned ${connect_code}, expected 303"
            exit 1
          fi

          if ! docker exec marrquee-stack-smoke test -e /config/install.json; then
            echo "::error::the positive control failed - /config/install.json is missing, so the record check below would prove nothing"
            exit 1
          fi
          if docker exec marrquee-stack-smoke test -e /config/existing_plex.json; then
            echo "::error::existing_plex.json was written despite every refusal above"
            exit 1
          fi

          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          if ! command -v grep > /dev/null; then
            echo "::error::grep is not available on the runner to check compose.yaml for existing-plex"
            exit 1
          fi
          if ! grep -F -q 'jellyfin:' "$compose_file"; then
            echo "::error::the positive control failed - jellyfin: is missing from compose.yaml, so the check below would prove nothing"
            exit 1
          fi
          set +e
          grep -F -q 'existing-plex' "$compose_file"
          existing_plex_leaked=$?
          set -e
          case "$existing_plex_leaked" in
            1) ;;
            0) echo "::error::existing-plex leaked into the real compose.yaml"; exit 1 ;;
            *) echo "::error::couldn't check compose.yaml for a leaked existing-plex service (grep exit ${existing_plex_leaked})"; exit 1 ;;
          esac

          if ! deploy_body=$(curl -fsS http://127.0.0.1:7788/api/deploy) || [ -z "$deploy_body" ]; then
            echo "::error::couldn't fetch /api/deploy to check existing-plex's own app list"
            exit 1
          fi
          if ! echo "$deploy_body" | jq -e 'all(.apps[]; .app_id != "existing-plex")' > /dev/null; then
            echo "::error::existing-plex appears in /api/deploy's own app list"
            exit 1
          fi

      # The visibility probe plants and removes a uniquely named EMPTY
      # folder of its own - this is the one place in the whole job that
      # touches a real bind-mounted folder an owner's media actually lives
      # in, so it runs against a sentinel file that is never a marker
      # itself, to prove the probe's own folder is left exactly as it was.
      - name: The Plex folder check leaves your Movies folder exactly as it was
        run: |
          set -euo pipefail

          root="$RUNNER_TEMP/marrquee-smoke/media"
          if ! before=$(ls -A "$root/data/media/movies"); then
            echo "::error::couldn't list data/media/movies before the plex folder check"
            exit 1
          fi

          touch "$root/data/media/movies/ci-not-a-marker"

          cat > "$RUNNER_TEMP/ci_plex_folder_marker.py" <<'PY'
          from pathlib import PurePosixPath

          from marrquee.config import Settings
          from marrquee.plex import make_folder_marker, remove_folder_marker
          from marrquee.state import load_state
          from marrquee.storage import to_host_view

          settings = Settings.from_env()
          state = load_state(settings.config_dir)
          if state is None:
              raise SystemExit("no install.json to read the storage root from")
          root = PurePosixPath(state.storage_root)
          movies = to_host_view(settings, str(root)) / "data" / "media" / "movies"

          marker_name = make_folder_marker(settings, root, "movies")
          created = (movies / marker_name).is_dir()

          remove_folder_marker(settings, root, "movies", marker_name)
          removed = not (movies / marker_name).exists()

          sentinel = movies / "ci-not-a-marker"
          remove_folder_marker(settings, root, "movies", "ci-not-a-marker")
          sentinel_survived = sentinel.exists()

          print(f"created={created}")
          print(f"removed={removed}")
          print(f"sentinel_survived={sentinel_survived}")
          PY
          docker cp "$RUNNER_TEMP/ci_plex_folder_marker.py" marrquee-stack-smoke:/tmp/ci_plex_folder_marker.py

          if ! marker_output=$(docker exec marrquee-stack-smoke python3 /tmp/ci_plex_folder_marker.py) || [ -z "$marker_output" ]; then
            echo "::error::the plex folder marker check failed to run"
            exit 1
          fi
          echo "$marker_output"

          if ! echo "$marker_output" | grep -qF "created=True"; then
            echo "::error::the plex folder marker was never created"
            exit 1
          fi
          if ! echo "$marker_output" | grep -qF "removed=True"; then
            echo "::error::the plex folder marker was not removed after the probe"
            exit 1
          fi
          if ! echo "$marker_output" | grep -qF "sentinel_survived=True"; then
            echo "::error::remove_folder_marker touched a folder Marrquee never marked itself"
            exit 1
          fi

          rm -f "$root/data/media/movies/ci-not-a-marker"

          if ! after=$(ls -A "$root/data/media/movies"); then
            echo "::error::couldn't list data/media/movies after the plex folder check"
            exit 1
          fi
          if [ "$after" != "$before" ]; then
            echo "::error::data/media/movies was not left exactly as it was before the plex folder check"
            exit 1
          fi

          if ! command -v find > /dev/null; then
            echo "::error::find is not available on the runner to check for a leftover plex-check marker"
            exit 1
          fi
          if ! leftover=$(find "$root/data/media/movies" -name 'marrquee-plex-check-*'); then
            echo "::error::couldn't search data/media/movies for a leftover plex-check marker"
            exit 1
          fi
          if [ -n "$leftover" ]; then
            echo "::error::a plex-check marker folder was left behind: ${leftover}"
            exit 1
          fi

      # The cycle's finale: Seerr is added through the real Hub install
      # endpoint alone, the same as every other app in this job - a script
      # that poked Seerr's API directly would prove nothing about
      # Marrquee's own bring-up. Seerr has no readiness probe of its own
      # (deploy.py's generic HttpReadinessProbe asks a route Seerr does not
      # have), so its own bring-up is exactly what this step proves. A
      # Plex-backed Seerr (new Plex, or the owner's own Plex) is wired the
      # same way in the real code, but stays PENDING the owner's NAS: CI's
      # Plex is long gone by now (`docker rm -f plex` above), and Plex and
      # Jellyfin never run at once.
      - name: Seerr is set up with Jellyfin, Sonarr and Radarr
        run: |
          set -euo pipefail

          if ! host_probe=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: marrquee-ci.local:7788' http://127.0.0.1:7788/) || [ -z "$host_probe" ]; then
            echo "::error::couldn't open the Hub as marrquee-ci.local to remember that address for Seerr"
            exit 1
          fi
          if [ "$host_probe" != "200" ]; then
            echo "::error::GET / as marrquee-ci.local returned ${host_probe}, expected 200"
            exit 1
          fi

          if ! response=$(curl -s -w '\n%{http_code}' -X POST http://127.0.0.1:7788/api/hub/apps/seerr/install -H 'Content-Type: application/json' -d '{"answers":{}}') || [ -z "$response" ]; then
            echo "::error::couldn't reach Marrquee to install Seerr"
            exit 1
          fi
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "seerr install response (${code}): ${body}"
          if [ "$code" != "202" ]; then
            echo "::error::POST /api/hub/apps/seerr/install returned ${code}, expected 202: ${body}"
            exit 1
          fi

          state=""
          add_state=""
          note=""
          busy=""
          line=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS http://127.0.0.1:7788/api/hub/status) || status=""
            if [ -n "$status" ]; then
              seerr=$(echo "$status" | jq -c '.apps[] | select(.app_id == "seerr")')
              state=$(echo "$seerr" | jq -r '.state')
              add_state=$(echo "$seerr" | jq -r '.add_state')
              note=$(echo "$seerr" | jq -r '.note')
              busy=$(echo "$status" | jq -r '.busy')
              line=$(echo "$seerr" | jq -r '.line')
              echo "seerr state: $state / add_state: $add_state / note: $note / busy: $busy"
              if [ "$add_state" = "error" ]; then
                MESSAGE="adding Seerr failed: ${line}" \
                  python3 -c "import os; text = os.environ['MESSAGE'][:500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
                exit 1
              fi
              if [ "$state" = "up" ] && [ "$add_state" = "null" ] && [ -z "$note" ] && [ "$busy" = "false" ]; then
                break
              fi
            fi
            sleep 5
          done
          if [ "$state" != "up" ] || [ "$add_state" != "null" ] || [ -n "$note" ] || [ "$busy" != "false" ]; then
            echo "::error::Seerr never finished adding within 10 minutes (state=${state}, add_state=${add_state}, note=${note}, busy=${busy})"
            exit 1
          fi

          seerr_dir="$RUNNER_TEMP/marrquee-smoke/media/marrquee/apps/seerr"
          if ! seerr_uid=$(stat -c '%u' "$seerr_dir") || [ -z "$seerr_uid" ]; then
            echo "::error::couldn't stat seerr's own config folder to check its owner"
            exit 1
          fi
          if [ "$seerr_uid" != "1000" ]; then
            echo "::error::seerr's config folder was not owned by uid 1000 (got: ${seerr_uid})"
            exit 1
          fi
          if [ ! -e "$seerr_dir/settings.json" ]; then
            echo "::error::Seerr couldn't write its settings folder"
            exit 1
          fi

          if ! seerr_init=$(docker inspect -f '{{.HostConfig.Init}}' seerr) || [ -z "$seerr_init" ]; then
            echo "::error::couldn't inspect seerr's container for its init flag"
            exit 1
          fi
          if [ "$seerr_init" != "true" ]; then
            echo "::error::seerr's container did not run with an init process"
            exit 1
          fi

          if ! seerr_port=$(docker inspect -f '{{index .HostConfig.PortBindings "5055/tcp"}}' seerr) || [ -z "$seerr_port" ]; then
            echo "::error::couldn't inspect seerr's container for its port binding"
            exit 1
          fi

          if ! seerr_gateway=$(docker inspect -f '{{(index .NetworkSettings.Networks "marrquee").Gateway}}' seerr) || [ -z "$seerr_gateway" ]; then
            echo "::error::couldn't inspect seerr's own gateway address on the marrquee network"
            exit 1
          fi

          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          if ! command -v grep > /dev/null; then
            echo "::error::grep is not available on the runner to check compose.yaml for seerr"
            exit 1
          fi
          if ! grep -F -q 'seerr:' "$compose_file"; then
            echo "::error::the positive control failed - seerr: is missing from compose.yaml, so the check below would prove nothing"
            exit 1
          fi
          set +e
          grep -F -q 'init: true' "$compose_file"
          seerr_init_rendered=$?
          set -e
          case "$seerr_init_rendered" in
            0) ;;
            1) echo "::error::seerr's compose service was never rendered with init: true"; exit 1 ;;
            *) echo "::error::couldn't check compose.yaml for seerr's init: true (grep exit ${seerr_init_rendered})"; exit 1 ;;
          esac

          cat > "$RUNNER_TEMP/ci_seerr_setup.py" <<'PY'
          import asyncio
          import os

          from marrquee.config import Settings
          from marrquee.login import load_login
          from marrquee.seerr import HttpSeerrClient, seerr_base_url
          from marrquee.state import load_state


          async def main() -> None:
              settings = Settings.from_env()
              state = load_state(settings.config_dir)
              if state is None:
                  raise SystemExit("no install.json to read seerr's key from")
              api_key = state.api_keys["seerr"]

              login = load_login(settings.config_dir).login
              if login is None:
                  raise SystemExit("no login saved to sign seerr in with")

              seerr_gateway = os.environ["SEERR_GATEWAY"]
              base_url = seerr_base_url()
              client = HttpSeerrClient()

              public = await client.request("GET", base_url, "api/v1/settings/public", api_key=None)
              if not public.ok or not isinstance(public.payload, dict):
                  raise SystemExit(f"seerr's public settings were unreachable (status {public.status})")
              if public.payload.get("initialized") is not True:
                  raise SystemExit("seerr was never marked initialized")
              if public.payload.get("mediaServerType") != 2:
                  raise SystemExit("seerr's media server type is not jellyfin")
              if public.payload.get("localLogin") is not False:
                  raise SystemExit("seerr still allows a local sign-in")

              main_settings = await client.request("GET", base_url, "api/v1/settings/main", api_key=api_key)
              if not main_settings.ok or not isinstance(main_settings.payload, dict):
                  raise SystemExit(f"seerr's main settings were unreachable (status {main_settings.status})")
              if main_settings.payload.get("defaultPermissions") != 32:
                  raise SystemExit("seerr's requests do not wait for the owner's approval")
              if main_settings.payload.get("newPlexLogin") is not True:
                  raise SystemExit("seerr does not let people it's shared with sign in")

              jellyfin_settings = await client.request(
                  "GET", base_url, "api/v1/settings/jellyfin", api_key=api_key
              )
              if not jellyfin_settings.ok or not isinstance(jellyfin_settings.payload, dict):
                  raise SystemExit(
                      f"seerr's jellyfin settings were unreachable (status {jellyfin_settings.status})"
                  )
              if jellyfin_settings.payload.get("ip") != seerr_gateway:
                  raise SystemExit("seerr's jellyfin connection does not point at its own gateway")
              if jellyfin_settings.payload.get("port") != 8096:
                  raise SystemExit("seerr's jellyfin connection is not on port 8096")
              if jellyfin_settings.payload.get("externalHostname") != "http://marrquee-ci.local:8096":
                  raise SystemExit("seerr's jellyfin connection does not use the remembered address")
              libraries = jellyfin_settings.payload.get("libraries")
              enabled_count = (
                  sum(
                      1
                      for library in libraries
                      if isinstance(library, dict) and library.get("enabled") is True
                  )
                  if isinstance(libraries, list)
                  else 0
              )
              if enabled_count != 2:
                  raise SystemExit("seerr does not have exactly two enabled jellyfin libraries")

              sonarr_settings = await client.request(
                  "GET", base_url, "api/v1/settings/sonarr", api_key=api_key
              )
              sonarr_entries = sonarr_settings.payload if isinstance(sonarr_settings.payload, list) else []
              if not sonarr_settings.ok or len(sonarr_entries) != 1:
                  raise SystemExit("seerr does not have exactly one sonarr entry")
              sonarr_entry = sonarr_entries[0]
              if sonarr_entry.get("hostname") != "sonarr":
                  raise SystemExit("seerr's sonarr entry does not point at sonarr")
              if sonarr_entry.get("activeDirectory") != "/data/media/tv":
                  raise SystemExit("seerr's sonarr entry does not use the tv library folder")
              if sonarr_entry.get("activeProfileName") != "WEB-1080p":
                  raise SystemExit("seerr's sonarr entry is not on Recyclarr's chosen profile")

              radarr_settings = await client.request(
                  "GET", base_url, "api/v1/settings/radarr", api_key=api_key
              )
              radarr_entries = radarr_settings.payload if isinstance(radarr_settings.payload, list) else []
              if not radarr_settings.ok or len(radarr_entries) != 1:
                  raise SystemExit("seerr does not have exactly one radarr entry")
              radarr_entry = radarr_entries[0]
              if radarr_entry.get("activeDirectory") != "/data/media/movies":
                  raise SystemExit("seerr's radarr entry does not use the movies library folder")
              if radarr_entry.get("activeProfileName") != "UHD Bluray + WEB":
                  raise SystemExit("seerr's radarr entry is not on Recyclarr's chosen profile")

              auth = await client.request(
                  "POST",
                  base_url,
                  "api/v1/auth/jellyfin",
                  api_key=None,
                  json_body={
                      "username": login.username,
                      "password": login.password,
                      "hostname": seerr_gateway,
                      "port": 8096,
                      "useSsl": False,
                      "urlBase": "",
                      "serverType": 2,
                  },
              )
              if not auth.ok:
                  raise SystemExit(f"signing in to seerr with the one login failed (status {auth.status})")

              # Each printed verdict is its own real comparison, never a bare
              # `True` - a mutation that hollowed one of the `if` checks
              # above out to `if False:` would still leave the raise
              # unreached, but it cannot also make ITS OWN line here read as
              # passing, because this expression is evaluated fresh.
              initialized_ok = public.payload.get("initialized") is True
              local_login_off = public.payload.get("localLogin") is False
              default_permissions_ok = main_settings.payload.get("defaultPermissions") == 32
              sonarr_ok = sonarr_entry.get("activeProfileName") == "WEB-1080p"
              radarr_ok = radarr_entry.get("activeProfileName") == "UHD Bluray + WEB"
              auth_ok = auth.ok

              print(f"initialized_ok={initialized_ok}")
              print(f"local_login_off={local_login_off}")
              print(f"default_permissions_ok={default_permissions_ok}")
              print(f"enabled_library_count={enabled_count}")
              print(f"sonarr_ok={sonarr_ok}")
              print(f"radarr_ok={radarr_ok}")
              print(f"auth_ok={auth_ok}")


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_seerr_setup.py" marrquee-stack-smoke:/tmp/ci_seerr_setup.py

          if ! setup_output=$(docker exec -e SEERR_GATEWAY="$seerr_gateway" marrquee-stack-smoke python3 /tmp/ci_seerr_setup.py 2>&1) || [ -z "$setup_output" ]; then
            echo "$setup_output"
            MESSAGE="Seerr's own setup check failed: ${setup_output}" \
              python3 -c "import os; text = os.environ['MESSAGE'][:800].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
            exit 1
          fi
          echo "$setup_output"

      # TMDB 603 (The Matrix) and 13 (Forrest Gump) are long-stable ids - no
      # indexer exists in this job, so Radarr searches and finds nothing,
      # which is harmless. Runner internet to TMDB is itself an
      # unverifiable condition, and gets its own ::error:: below rather than
      # being folded into a generic failure.
      - name: A request in Seerr reaches Radarr, and a shared person's request waits for you
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ci_seerr_request.py" <<'PY'
          import asyncio
          import secrets

          import httpx

          from marrquee.config import Settings
          from marrquee.docker_client import SocketDockerEngine
          from marrquee.jellyfin import HttpJellyfinServer, jellyfin_base_url, load_jellyfin
          from marrquee.plex import plex_host_address
          from marrquee.seerr import HttpSeerrClient, seerr_base_url
          from marrquee.state import load_state


          async def main() -> None:
              settings = Settings.from_env()
              state = load_state(settings.config_dir)
              if state is None:
                  raise SystemExit("no install.json to read the api keys from")
              seerr_key = state.api_keys["seerr"]
              radarr_key = state.api_keys["radarr"]
              seerr_url = seerr_base_url()

              seerr_client = HttpSeerrClient()
              owner_request = await seerr_client.request(
                  "POST",
                  seerr_url,
                  "api/v1/request",
                  api_key=seerr_key,
                  json_body={"mediaType": "movie", "mediaId": 603},
              )
              if not owner_request.ok or owner_request.status != 201:
                  raise SystemExit(f"the owner's request was refused (status {owner_request.status})")
              if not isinstance(owner_request.payload, dict) or owner_request.payload.get("status") != 2:
                  raise SystemExit("the owner's own request was not auto-approved")

              # Radarr's key travels only in the header - never the query
              # string, which curl-style tools and access logs both echo in
              # the clear.
              radarr_headers = {"X-Api-Key": radarr_key}
              radarr_got_it = False
              async with httpx.AsyncClient(timeout=10.0) as radarr_client:
                  profiles_response = await radarr_client.get(
                      "http://radarr:7878/api/v3/qualityprofile", headers=radarr_headers
                  )
                  if profiles_response.status_code != 200:
                      raise SystemExit(
                          "couldn't read Radarr's quality profiles "
                          f"(status {profiles_response.status_code})"
                      )
                  profile_names = {
                      profile["id"]: profile["name"] for profile in profiles_response.json()
                  }

                  for _ in range(24):
                      radarr_response = await radarr_client.get(
                          "http://radarr:7878/api/v3/movie",
                          params={"tmdbId": "603"},
                          headers=radarr_headers,
                      )
                      if radarr_response.status_code == 200:
                          movies = radarr_response.json()
                          if movies:
                              profile_id = movies[0].get("qualityProfileId")
                              radarr_got_it = profile_names.get(profile_id) == "UHD Bluray + WEB"
                              if radarr_got_it:
                                  break
                      await asyncio.sleep(5)

              engine = SocketDockerEngine(settings.docker_socket, compose_binary=settings.compose_binary)
              self_id = await engine.self_container_id()
              address = await plex_host_address(engine, self_id)
              if address is None:
                  raise SystemExit("Marrquee could not work out its own reachable address for Jellyfin")
              jellyfin_url = jellyfin_base_url(address)
              jellyfin_record = load_jellyfin(settings.config_dir)
              if jellyfin_record is None:
                  raise SystemExit("no jellyfin.json was saved to create the friend's account")

              seerr_gateway = await engine.host_gateway("seerr")
              if seerr_gateway is None:
                  raise SystemExit("could not read seerr's own gateway address to sign the friend in")

              friend_password = secrets.token_hex(16)
              jellyfin_server = HttpJellyfinServer()
              new_user = await jellyfin_server.request(
                  "POST",
                  jellyfin_url,
                  "/Users/New",
                  token=jellyfin_record.api_key,
                  json_body={"Name": "marrquee-ci-friend", "Password": friend_password},
              )
              if not new_user.ok:
                  raise SystemExit(f"couldn't create the friend's Jellyfin account (status {new_user.status})")

              friend_waits = False
              async with httpx.AsyncClient(base_url=seerr_url) as friend_session:
                  friend_auth = await friend_session.post(
                      "/api/v1/auth/jellyfin",
                      json={
                          "username": "marrquee-ci-friend",
                          "password": friend_password,
                          "hostname": seerr_gateway,
                          "port": 8096,
                          "useSsl": False,
                          "urlBase": "",
                          "serverType": 2,
                      },
                  )
                  if friend_auth.status_code != 200:
                      raise SystemExit(
                          f"signing the friend in to seerr failed (status {friend_auth.status_code})"
                      )

                  friend_request = await friend_session.post(
                      "/api/v1/request", json={"mediaType": "movie", "mediaId": 13}
                  )
                  if friend_request.status_code != 201:
                      raise SystemExit(
                          f"the friend's request did not answer 201 (got {friend_request.status_code})"
                      )
                  friend_payload = friend_request.json()
                  friend_waits = friend_payload.get("status") == 1

              print(f"radarr_got_it={radarr_got_it}")
              print(f"friend_waits={friend_waits}")


          asyncio.run(main())
          PY
          docker cp "$RUNNER_TEMP/ci_seerr_request.py" marrquee-stack-smoke:/tmp/ci_seerr_request.py

          if ! request_output=$(docker exec marrquee-stack-smoke python3 /tmp/ci_seerr_request.py 2>&1) || [ -z "$request_output" ]; then
            echo "$request_output"
            echo "::error::the seerr request script failed to run"
            exit 1
          fi
          echo "$request_output"

          if ! echo "$request_output" | grep -qF "radarr_got_it=True"; then
            echo "::error::The owner's request didn't reach Radarr (Seerr needs TMDB - check the runner's internet)"
            exit 1
          fi
          if ! echo "$request_output" | grep -qF "friend_waits=True"; then
            echo "::error::A shared person's request didn't wait for approval"
            exit 1
          fi

      # The one place technical detail is allowed to show up, and exactly
      # where a first-time developer needs it: a red run here is debuggable
      # from the workflow's own log, not just "it failed". The same text
      # also lands in a `::error::` annotation (truncated, and defensively
      # escaped - it is already redacted by `_redact_secrets`, but the
      # annotation itself must never be able to inject a further workflow
      # command), because the public annotations API is readable without a
      # login and the job log is not.
      - name: Dump diagnostics and Marrquee's own logs on failure
        if: failure()
        run: |
          echo "---- GET /api/deploy/diagnostics ----"
          diagnostics=$(curl -fsS http://127.0.0.1:7788/api/deploy/diagnostics || true)
          echo "$diagnostics"
          if [ -n "$diagnostics" ]; then
            DIAGNOSTICS="$diagnostics" \
              python3 -c "import os; text = os.environ['DIAGNOSTICS'][:1500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::Marrquee diagnostics (first 1500 chars): ' + text)"
          fi
          echo "---- docker logs marrquee-stack-smoke ----"
          docker logs marrquee-stack-smoke || true
          echo "---- docker logs recyclarr ----"
          docker logs recyclarr || true
          echo "---- docker logs plex ----"
          docker logs plex || true
          echo "---- docker logs jellyfin ----"
          docker logs jellyfin || true
          echo "---- docker logs seerr ----"
          docker logs seerr || true

      - name: Clean up every container, network and temp folder this job made
        if: always()
        run: |
          docker rm -f prowlarr sonarr radarr gluetun qbittorrent recyclarr plex jellyfin seerr marrquee-graphics-check marrquee-stack-smoke 2>/dev/null || true
          docker network rm marrquee 2>/dev/null || true
          # A device node this job mknod'd on the runner's own /dev - never
          # removed when the runner already had a real one, and `|| true`
          # both ways means a leftover never turns a green run red.
          if [ -f "$RUNNER_TEMP/marrquee-made-dri" ]; then
            sudo rm -f /dev/dri/renderD128 || true
            sudo rmdir /dev/dri 2>/dev/null || true
          fi
          # Some of what's under here (a container's own /config contents)
          # can be created by the Docker daemon as root, which would block a
          # plain `rm -rf` run as the unprivileged runner user - GitHub-hosted
          # runners carry passwordless sudo for exactly this, and `|| true`
          # means a leftover temp folder never turns a green run red.
          sudo rm -rf "$RUNNER_TEMP/marrquee-smoke" || true
