name: CI

# Quoted so PyYAML (used by tests/test_workflow.py) reads this key back as
# the string "on" rather than the boolean True, which is how YAML 1.1
# parses a bare `on:` key.
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run the test suite
        run: uv run pytest

  image:
    name: Build, smoke test and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Registers QEMU binfmt handlers so the runner's amd64 kernel can
      # execute an arm64 image - this is what proves "works on ARM" without
      # the owner's NAS ever being involved.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A multi-platform build cannot be `--load`ed into the local Docker
      # daemon, so each architecture is built single-platform and loaded on
      # its own for the smoke test below. The multi-arch build that actually
      # gets pushed happens once, later, after both smokes pass.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marrquee:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner's own /var/run/docker.sock is a real Linux daemon socket
      # (not the VM shim a Mac's Docker Desktop presents), so this is a
      # stronger check than the dev machine could ever give.
      - name: Start the amd64 image against the runner's real Docker socket
        run: |
          docker run -d --name marrquee-smoke-amd64 \
            -p 7788:7788 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            marrquee:smoke-amd64

      - name: Wait for the amd64 image to answer /healthz
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 30s on amd64"
          docker logs marrquee-smoke-amd64
          exit 1

      - name: Assert the amd64 image is talking to the runner's real Docker daemon
        run: curl -fsS http://127.0.0.1:7788/ | grep -q "Talking to Docker"

      - name: Stop the amd64 smoke container
        if: always()
        run: docker rm -f marrquee-smoke-amd64

      # This is the answer to the one question reading the code can't settle:
      # does the pinned docker-compose binary bring services up with no
      # `docker` CLI in the image? A separate, ephemeral container proves it
      # against the runner's real socket, independent of the alive-page smoke
      # above.
      - name: Prove the pinned compose binary runs without a docker CLI
        run: docker run --rm --entrypoint /usr/local/bin/docker-compose marrquee:smoke-amd64 version

      - name: Write a throwaway compose file for the compose-binary smoke
        run: |
          cat > compose-smoke.yaml <<'EOF'
          services:
            smoke:
              image: alpine:3.20
              container_name: marrquee-compose-smoke
              command: ["sleep", "300"]
          EOF

      - name: Bring the throwaway service up through the image's compose binary
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/compose-smoke.yaml:/tmp/compose-smoke.yaml:ro" \
            --entrypoint /usr/local/bin/docker-compose \
            marrquee:smoke-amd64 \
            -p compose-smoke -f /tmp/compose-smoke.yaml up -d

      - name: Assert the compose-binary smoke's service is running
        run: |
          docker ps --filter "name=marrquee-compose-smoke" --format '{{.Names}}' \
            | grep -q marrquee-compose-smoke

      - name: Remove the compose-binary smoke's throwaway container
        if: always()
        run: docker rm -f marrquee-compose-smoke || true

      - name: Build the arm64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: marrquee:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only /healthz is asserted here - it needs no Docker socket, and the
      # only thing this step is proving is "does this binary start on ARM".
      - name: Start the arm64 image under QEMU emulation
        run: |
          docker run -d --name marrquee-smoke-arm64 \
            --platform linux/arm64 \
            -p 7788:7788 \
            marrquee:smoke-arm64

      - name: Wait for the arm64 image to answer /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 60s on arm64"
          docker logs marrquee-smoke-arm64
          exit 1

      - name: Stop the arm64 smoke container
        if: always()
        run: docker rm -f marrquee-smoke-arm64

      # Everything from here on only runs for a real push (never for a pull
      # request, which cannot use `packages: write`), and only after both
      # smokes above have passed - a half-tested image never reaches :latest.
      - name: Prepare image metadata for the published tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Written out literally, never derived from the repository's own
          # name - that carries its real mixed case (PurpleFox-07/marrquee),
          # and GHCR rejects uppercase image paths.
          images: ghcr.io/purplefox-07/marrquee
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Written out on purpose: this label is what makes the published
          # package's page on GitHub link back to the project page. The action
          # would also derive it on its own, but a stated value can be read
          # here and is pinned by a test.
          labels: |
            org.opencontainers.image.source=https://github.com/PurpleFox-07/marrquee

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published tag lists both platforms
        if: github.event_name == 'push'
        run: |
          output=$(docker buildx imagetools inspect ghcr.io/purplefox-07/marrquee:latest)
          echo "$output"
          echo "$output" | grep -q "linux/amd64"
          echo "$output" | grep -q "linux/arm64"

  # This is the acceptance vehicle for every "unverifiable by reading"
  # condition the deploy engine carries: real Docker, real arr images, a
  # real deploy driven the exact way the owner's own first NAS commands
  # will drive it. It pulls three external images and can go red for
  # reasons that have nothing to do with this repository's own code (a
  # registry hiccup, a slow image pull) - so, deliberately, it `needs: test`
  # alone and is never in `image`'s `needs:`, and `image` is never in this
  # job's `needs:` either. A red run here is loud (this job still fails, and
  # the whole workflow shows red) but it never holds back `:latest`.
  stack-smoke:
    name: Real-Docker stack smoke (three arr apps, real deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image for the stack smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marrquee:stack-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh, empty folder on the runner's own disk - never inside the
      # repository checkout - so a fresh-start refusal can never fire here.
      - name: Create a fresh storage root under the runner's temp directory
        run: mkdir -p "$RUNNER_TEMP/marrquee-smoke/media"

      # Started the same way `compose.install.yaml` starts it, but mirroring
      # its partial-mount shape rather than a whole-drive one: the socket,
      # the port, and the runner's own temp root mounted at `/host` plus
      # that same path. That's the exact "host path X lands at /host/X"
      # mapping the NAS now uses, so this proves it against a mount that
      # only covers part of the host, not `/:/host`, while still reaching
      # the storage root created just above.
      - name: Start the built image the way the install file does
        run: |
          docker run -d --name marrquee-stack-smoke \
            -p 7788:7788 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/host${RUNNER_TEMP}" \
            marrquee:stack-smoke

      - name: Wait for Marrquee to answer /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::marrquee never answered /healthz within 60s"
          docker logs marrquee-stack-smoke
          exit 1

      # The API only ever sees a HOST path - Marrquee translates it to
      # `<host_mount>/<that path>` internally, and the generated compose
      # file carries this exact host path back out again.
      - name: Install all three apps against the runner's own temp folder
        run: |
          curl -fsS -X POST http://127.0.0.1:7788/api/install \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"${RUNNER_TEMP}/marrquee-smoke/media\",\"app_ids\":[\"prowlarr\",\"sonarr\",\"radarr\"]}"

      - name: Start the deploy
        run: curl -fsS -X POST http://127.0.0.1:7788/api/deploy

      # Generous on purpose: this is the first time all three images are
      # ever pulled, on a shared runner with no cache for them.
      #
      # On failure, the snapshot's own `code` and `headline` land straight
      # in a `::error::` annotation - GitHub's public annotations API is
      # readable without a login, unlike the job log itself, and both
      # fields are already plain-language and secret-free by the API's own
      # contract (see routes/api.py - only /api/deploy/diagnostics ever
      # carries technical detail).
      - name: Poll GET /api/deploy until it reaches finale (8+ minute budget)
        run: |
          for _ in $(seq 1 260); do
            body=$(curl -fsS http://127.0.0.1:7788/api/deploy)
            phase=$(echo "$body" | jq -r '.phase')
            echo "deploy phase: $phase"
            if [ "$phase" = "finale" ]; then
              exit 0
            fi
            if [ "$phase" = "error" ]; then
              code=$(echo "$body" | jq -r '.failure.code // "unknown"')
              headline=$(echo "$body" | jq -r '.headline // "the deploy reported an error"')
              MESSAGE="the deploy reached error (${code}): ${headline}" \
                python3 -c "import os; text = os.environ['MESSAGE'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::' + text)"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the deploy never reached finale in time"
          exit 1

      - name: Assert all three containers are running
        run: |
          for name in prowlarr sonarr radarr; do
            docker ps --filter "name=^${name}$" --format '{{.Names}}' | grep -qx "$name"
          done

      # This is the regression this whole job exists to catch: every app
      # container, and Marrquee's own, must share the `marrquee` network -
      # not just have a network of that name sitting unused alongside them.
      - name: Assert the marrquee network lists all three apps and Marrquee itself
        run: |
          members=$(docker network inspect marrquee --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "marrquee network members: $members"
          for name in prowlarr sonarr radarr marrquee-stack-smoke; do
            echo "$members" | grep -qw "$name"
          done

      # write_compose chowns this file to the drive's own owner (not root)
      # specifically so it can be read - by the owner on their NAS, and by
      # this very step here. Asserted on its own, before the step that reads
      # it, so a regression here is named instead of surfacing as a
      # mysterious 401 two steps later.
      - name: Assert the compose file is readable by the current user
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          if [ ! -r "$compose_file" ]; then
            echo "::error::$compose_file is not readable by $(whoami) - write_compose's chown regressed"
            ls -l "$compose_file" || true
            exit 1
          fi

      # The API never exposes an app's key - it is read here straight off
      # the generated compose file on the runner's own disk, the same file
      # the owner is told to open and read in the README. Never echoed.
      - name: Assert each app answers system/status with the key from its own compose file
        run: |
          compose_file="$RUNNER_TEMP/marrquee-smoke/media/marrquee/compose.yaml"
          prowlarr_key=$(grep -E '^\s*PROWLARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          sonarr_key=$(grep -E '^\s*SONARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          radarr_key=$(grep -E '^\s*RADARR__AUTH__APIKEY:' "$compose_file" | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "$prowlarr_key" ]; then
            echo "::error::could not read Prowlarr's API key out of the compose file"
            exit 1
          fi
          if [ -z "$sonarr_key" ]; then
            echo "::error::could not read Sonarr's API key out of the compose file"
            exit 1
          fi
          if [ -z "$radarr_key" ]; then
            echo "::error::could not read Radarr's API key out of the compose file"
            exit 1
          fi
          curl -fsS -H "X-Api-Key: ${prowlarr_key}" http://127.0.0.1:9696/api/v1/system/status
          curl -fsS -H "X-Api-Key: ${sonarr_key}" http://127.0.0.1:8989/api/v3/system/status
          curl -fsS -H "X-Api-Key: ${radarr_key}" http://127.0.0.1:7878/api/v3/system/status

      - name: Assert the expected folders exist inside the chosen root
        run: |
          root="$RUNNER_TEMP/marrquee-smoke/media"
          test -d "$root/data/torrents/tv"
          test -d "$root/data/torrents/movies"
          test -d "$root/data/media/tv"
          test -d "$root/data/media/movies"
          test -f "$root/marrquee/compose.yaml"
          test -f "$root/marrquee/marrquee-root.json"

      # The one place technical detail is allowed to show up, and exactly
      # where a first-time developer needs it: a red run here is debuggable
      # from the workflow's own log, not just "it failed". The same text
      # also lands in a `::error::` annotation (truncated, and defensively
      # escaped - it is already redacted by `_redact_secrets`, but the
      # annotation itself must never be able to inject a further workflow
      # command), because the public annotations API is readable without a
      # login and the job log is not.
      - name: Dump diagnostics and Marrquee's own logs on failure
        if: failure()
        run: |
          echo "---- GET /api/deploy/diagnostics ----"
          diagnostics=$(curl -fsS http://127.0.0.1:7788/api/deploy/diagnostics || true)
          echo "$diagnostics"
          if [ -n "$diagnostics" ]; then
            DIAGNOSTICS="$diagnostics" \
              python3 -c "import os; text = os.environ['DIAGNOSTICS'][:1500].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A').replace('::', ': :'); print('::error::Marrquee diagnostics (first 1500 chars): ' + text)"
          fi
          echo "---- docker logs marrquee-stack-smoke ----"
          docker logs marrquee-stack-smoke || true

      - name: Clean up every container, network and temp folder this job made
        if: always()
        run: |
          docker rm -f prowlarr sonarr radarr marrquee-stack-smoke 2>/dev/null || true
          docker network rm marrquee 2>/dev/null || true
          # Some of what's under here (a container's own /config contents)
          # can be created by the Docker daemon as root, which would block a
          # plain `rm -rf` run as the unprivileged runner user - GitHub-hosted
          # runners carry passwordless sudo for exactly this, and `|| true`
          # means a leftover temp folder never turns a green run red.
          sudo rm -rf "$RUNNER_TEMP/marrquee-smoke" || true
